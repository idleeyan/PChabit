<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>PChabit 硬件时序</title>
<style>
  html, body { margin:0; padding:0; background:#0f172a; color:#e2e8f0; font:12px/1.4 "Segoe UI","Microsoft YaHei",sans-serif; }
  #wrap { padding:12px; box-sizing:border-box; }
  #meta { margin-bottom:8px; color:#94a3b8; }
  canvas { width:100%; height:220px; display:block; background:#111827; border-radius:8px; border:1px solid #1f2937; }
  .legend { margin-top:8px; display:flex; gap:16px; color:#94a3b8; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="meta">等待数据…</div>
  <canvas id="c" width="860" height="220"></canvas>
  <div class="legend">
    <span><i class="dot" style="background:#10B981"></i>CPU %</span>
    <span><i class="dot" style="background:#0EA5E9"></i>GPU %</span>
    <span><i class="dot" style="background:#F59E0B"></i>GPU 温度（右轴估算）</span>
  </div>
</div>
<script>
// host 注入: window.__HW_DATA__ = { hours:[{label,cpu,gpu,temp,n}], summary:"" }
function draw(data) {
  var meta = document.getElementById('meta');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  var hours = (data && data.hours) || [];
  meta.textContent = (data && data.summary) || (hours.length ? '周期小时负载' : '暂无硬件样本');
  if (!hours.length) return;

  var padL = 36, padR = 36, padT = 16, padB = 28;
  var plotW = w - padL - padR, plotH = h - padT - padB;
  var maxLoad = 100;
  var temps = hours.map(function(x){ return x.temp == null ? null : x.temp; }).filter(function(x){ return x != null; });
  var maxTemp = temps.length ? Math.max(100, Math.ceil(Math.max.apply(null, temps) / 10) * 10) : 100;

  // grid
  ctx.strokeStyle = '#1f2937';
  ctx.fillStyle = '#64748b';
  ctx.lineWidth = 1;
  for (var g = 0; g <= 4; g++) {
    var y = padT + plotH * g / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    var label = Math.round(maxLoad * (1 - g / 4)) + '%';
    ctx.fillText(label, 6, y + 4);
  }

  var n = hours.length;
  var step = plotW / Math.max(n, 1);
  function series(key, color, scaleMax, fill) {
    ctx.beginPath();
    var started = false;
    for (var i = 0; i < n; i++) {
      var v = hours[i][key];
      if (v == null) continue;
      var x = padL + step * i + step / 2;
      var y = padT + plotH * (1 - Math.min(v, scaleMax) / scaleMax);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (fill) {
      ctx.lineTo(padL + step * (n - 1) + step / 2, padT + plotH);
      ctx.lineTo(padL + step / 2, padT + plotH);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }
  }

  series('cpu', '#10B981', maxLoad, 'rgba(16,185,129,0.12)');
  series('gpu', '#0EA5E9', maxLoad, 'rgba(14,165,233,0.08)');
  series('temp', '#F59E0B', maxTemp, null);

  // x labels (sparse)
  ctx.fillStyle = '#64748b';
  var every = Math.ceil(n / 12);
  for (var i = 0; i < n; i++) {
    if (i % every !== 0) continue;
    var x = padL + step * i + step / 2;
    ctx.fillText(hours[i].label || String(i), x - 6, h - 8);
  }
}

window.addEventListener('message', function (e) {
  var d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
  if (d) { window.__HW_DATA__ = d; draw(d); }
});

document.addEventListener('DOMContentLoaded', function () {
  if (window.__HW_DATA__) draw(window.__HW_DATA__);
});
</script>
</body>
</html>
