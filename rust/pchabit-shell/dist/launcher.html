<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit Shell</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#0f172a; color:#e2e8f0;
    font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
  #wrap { padding:28px 32px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  .sub { color:#94a3b8; font-size:12px; margin-bottom:22px; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; max-width:640px; }
  button {
    text-align:left; padding:14px 16px; border-radius:10px; cursor:pointer;
    background:#182234; border:1px solid #263349; color:#e2e8f0;
  }
  button:hover { background:#20304a; border-color:#3b82f6; }
  button b { display:block; font-size:14px; margin-bottom:4px; }
  button span { color:#94a3b8; font-size:12px; }
  #status { margin-top:18px; color:#94a3b8; font-size:12px; min-height:18px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>PChabit · Tauri 壳</h1>
  <div class="sub">P4-1 只读页迁移 · 图表资产沿用原 HTML，数据由壳内 Rust 直接查库注入</div>
  <div class="grid">
    <button onclick="open_('hardware')"><b>硬件趋势</b><span>近 7 天 CPU / GPU / 温度分时</span></button>
    <button onclick="open_('activity')"><b>每小时活动</b><span>今日分时活跃分钟（含未来小时占位）</span></button>
    <button onclick="open_('category')"><b>分类构成</b><span>近 7 天应用分类时长占比</span></button>
    <button onclick="open_('sankey')"><b>应用切换关系</b><span>近 7 天应用流向与切换次数</span></button>
  </div>
  <div id="status"></div>
</div>
<script>
  function open_(page) {
    var s = document.getElementById('status');
    if (!window.__TAURI__) { s.textContent = 'invoke 通道不可用'; return; }
    s.textContent = '正在打开 ' + page + ' …';
    window.__TAURI__.core.invoke('open_page', { page: page })
      .then(function (r) { s.textContent = r; })
      .catch(function (e) { s.textContent = '打开失败：' + e; });
  }
</script>
</body>
</html>
