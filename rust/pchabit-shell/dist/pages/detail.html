<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 应用详情</title>
<style>#app { display:flex; height:100vh; }
/* 全屏分栏：body 内边距归零，否则 100vh + padding 会顶出滚动条 */
html body { padding:0; }
aside { width:248px; flex:none; background:linear-gradient(180deg,var(--surface-2),var(--surface)); border-right:1px solid var(--border);
    display:flex; flex-direction:column; }
aside .top { padding:10px 10px 6px; }
aside input { width:100%; box-sizing:border-box; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px; outline:none; }
aside input:focus { border-color:var(--gold); }
aside ul { list-style:none; margin:0; padding:0 6px 10px; overflow:auto; flex:1; }
aside li { padding:5px 8px; border-radius:6px; cursor:pointer; display:flex;
    justify-content:space-between; gap:8px; }
aside li:hover { background:var(--surface-3); }
aside li.on { background:var(--gold-soft); }
aside li .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
aside li .mn { color:var(--mute); font-size:10px; flex:none; }
aside .ranges { display:flex; gap:4px; padding:0 10px 8px; }
aside .ranges button { flex:1; background:var(--surface-3); border:1px solid var(--border); color:var(--dim);
    border-radius:5px; padding:2px 0; font-size:10px; cursor:pointer; font-family:inherit; }
aside .ranges button:hover { border-color:var(--gold); color:var(--text); }
aside .ranges button.on { background:var(--gold-soft); border-color:var(--gold); color:var(--text); }
main { flex:1; min-width:0; padding:14px 16px 20px; overflow:auto; }
.sub { color:var(--dim); font-size:11px; margin-bottom:12px; }
.kpi .d { font-size:10px; }
.up { color:var(--green); }
.down { color:var(--red); }
.flat { color:var(--dim); }
.row { display:grid; grid-template-columns:1.2fr .8fr; gap:12px; }
@media (max-width:820px){ .row{ grid-template-columns:1fr; } }
.heat { display:grid; grid-template-columns:repeat(24,1fr); gap:2px; }
.heat i { height:26px; border-radius:3px; background:var(--surface-3); display:block; }
.heatlbl { display:grid; grid-template-columns:repeat(24,1fr); gap:2px; margin-top:2px;
    font-size:9px; color:var(--mute); text-align:center; }
.trend { display:grid; grid-template-columns:repeat(auto-fill, minmax(16px, 1fr)); gap:4px; }
.trend > div { text-align:center; }
.trend .bar { height:46px; display:flex; align-items:flex-end; }
.trend .bar i { display:block; width:100%; background:var(--gold); border-radius:3px; min-height:2px; }
.trend .lb { font-size:9px; color:var(--mute); }
.trend .vv { font-size:9px; color:var(--dim); }
td { padding:3px 0; border-bottom:1px solid rgba(58,48,29,.55); font-size:11px; }
td.k { color:var(--dim); }
td.v { text-align:right; }
ul.titles { list-style:none; margin:0; padding:0; }
ul.titles li { font-size:11px; color:var(--text); padding:4px 0; border-bottom:1px solid rgba(58,48,29,.55);
    word-break:break-all; }</style>
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<div id="app">
  <aside>
    <div class="top"><input id="q" placeholder="搜索应用…" /></div>
    <div class="ranges" id="ranges">
      <button data-days="0" class="on">全部</button>
  <button data-days="1">今日</button>
      <button data-days="7">7天</button>
      <button data-days="30">30天</button>
      <button data-days="90">90天</button>
    </div>
    <ul id="list"></ul>
  </aside>
  <main>
    <h1 id="name">选择一个应用</h1>
    <div class="sub" id="sub">左侧是所选范围内出现过的进程，点一下看详情</div>

    <div class="kpis" id="kpis"></div>

    <div class="row">
      <section>
        <h2 id="heath2">24 小时分布（近 7 天累计）</h2>
        <div class="heat" id="heat"></div>
        <div class="heatlbl" id="heatlbl"></div>
        <h2 style="margin-top:14px">每日趋势</h2>
        <div class="trend" id="trend"></div>
      </section>
      <section>
        <h2>运行画像</h2>
        <table id="facts"></table>
        <h2 style="margin-top:14px">窗口标题 Top 5</h2>
        <ul class="titles" id="titles"></ul>
      </section>
    </div>
  </main>
</div>
<script>
  var APPS = [];
  var CUR = null;
  var chosenDays = 0;   // 0 = 全部历史

  function rangeLabel() {
    return chosenDays <= 0 ? '全部历史' : (chosenDays === 1 ? '今日' : ('近 ' + chosenDays + ' 天'));
  }

  function fmtMins(v) {
    var m = Math.round(v || 0);
    if (m <= 0) {
      var sec = Math.round((v || 0) * 60);
      return sec > 0 ? sec + ' 秒' : '0 分钟';
    }
    if (m < 60) return m + ' 分钟';
    return Math.floor(m / 60) + 'h' + (m % 60) + 'm';
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var LEVEL = ['#1a150d', '#3d2f14', '#6b511d', '#9c7628', '#d9b45a'];

  function renderList() {
    var kw = (document.getElementById('q').value || '').trim().toLowerCase();
    var ul = document.getElementById('list');
    ul.innerHTML = '';
    var shown = 0;
    APPS.forEach(function (a) {
      if (kw && (a.appName || '').toLowerCase().indexOf(kw) < 0 &&
          (a.processName || '').toLowerCase().indexOf(kw) < 0) return;
      shown++;
      var li = el('li', CUR && CUR.processName === a.processName ? 'on' : '');
      li.appendChild(el('span', 'nm', a.appName || a.processName));
      li.appendChild(el('span', 'mn', Math.round(a.minutes) + 'm'));
      li.addEventListener('click', function () { select(a); });
      ul.appendChild(li);
    });
    if (!shown) ul.appendChild(el('li', 'empty', '没有匹配的应用'));
  }

  function select(a) {
    CUR = a;
    renderList();
    document.getElementById('name').textContent = a.appName || a.processName;
    document.getElementById('sub').textContent = '加载中…';
    window.__TAURI__.core.invoke('app_detail', {
      process: a.processName,
      appName: a.appName || '',
      category: a.category || '',
      days: chosenDays,
    }).then(function (d) {
      window.__DETAIL_RESULT__ = paintDetail(d, a);
    }).catch(function (e) {
      document.getElementById('sub').textContent = '详情加载失败：' + e;
      window.__DETAIL_RESULT__ = 'error: ' + e;
    });
  }

  // 注意：这里不能再叫 renderDetail —— 脚本尾部会给 window.renderDetail 赋「装列表」的入口函数，
  // 同名会把这里的详情绘制函数覆盖掉，点开应用后 then 里调到的其实是入口函数，
  // 结果就是左侧列表被清空、右侧 KPI/热力图全空（4.12.7 修）。
  function paintDetail(d, a) {
    document.getElementById('sub').textContent =
      a.processName + '　分类 ' + (d.category || '未分类') + '　' + rangeLabel();
    var h2 = document.getElementById('heath2');
    if (h2) h2.textContent = '24 小时分布（' + rangeLabel() + '累计）';

    // KPI
    var kp = document.getElementById('kpis');
    kp.innerHTML = '';
    [
      ['总时长', fmtMins(d.totalMinutes), d.deltaText, d.deltaDirection],
      ['会话数', String(d.sessions || 0), '', 'flat'],
      ['最长一次', fmtMins(d.longestSessionMinutes), '', 'flat'],
      ['平均每次', fmtMins(d.avgMinutes), '', 'flat'],
      ['专注次数', String(d.focusCount || 0), fmtMins(d.focusMinutes) + ' 专注', 'flat'],
      ['键鼠', d.hasKeyMouse ? String(Math.round(d.mouseClicks || 0)) + ' 点击' : '无按键记录', '', 'flat'],
    ].forEach(function (k) {
      var box = el('div', 'kpi');
      box.appendChild(el('div', 'n', k[0]));
      box.appendChild(el('div', 'v', k[1]));
      if (k[2] !== '' && k[2] != null) {
        var dd = el('div', 'd ' + (k[3] === 'up' ? 'up' : k[3] === 'down' ? 'down' : 'flat'), k[2]);
        box.appendChild(dd);
      }
      kp.appendChild(box);
    });

    // 24h
    var heat = document.getElementById('heat');
    var lbl = document.getElementById('heatlbl');
    heat.innerHTML = ''; lbl.innerHTML = '';
    var hours = d.hourly || [];
    var maxH = hours.reduce(function (m, h) { return Math.max(m, h.minutes || 0); }, 1);
    hours.forEach(function (h, i) {
      var cell = el('i');
      var lv = h.minutes > 0 ? Math.min(4, Math.ceil((h.minutes / maxH) * 4)) : 0;
      cell.style.background = LEVEL[lv];
      cell.title = h.label + ' 点 · ' + Math.round(h.minutes || 0) + ' 分钟';
      heat.appendChild(cell);
      if (i % 3 === 0) lbl.appendChild(el('span', null, h.label));
      else lbl.appendChild(el('span', null, ''));
    });

    // 日趋势：范围长的时候按块合并（最多约 30 根柱），否则 154 天全铺开会糊成一片
    var tr = document.getElementById('trend');
    tr.innerHTML = '';
    var raw = d.dailyTrend || [];
    var days = raw;
    if (raw.length > 30) {
      var per = Math.ceil(raw.length / 30);
      days = [];
      for (var i0 = 0; i0 < raw.length; i0 += per) {
        var chunk = raw.slice(i0, i0 + per);
        var sum = chunk.reduce(function (a, x) { return a + (x.minutes || 0); }, 0);
        days.push({
          dateLabel: chunk[0].dateLabel + (chunk.length > 1 ? '~' + chunk[chunk.length - 1].dateLabel : ''),
          minutes: sum,
          span: chunk.length,
        });
      }
    }
    var maxD = days.reduce(function (m, x) { return Math.max(m, x.minutes || 0); }, 1);
    var labelStep = days.length > 8 ? Math.ceil(days.length / 8) : 1;
    days.forEach(function (x, idx) {
      var box = el('div');
      var bar = el('div', 'bar');
      var fill = el('i');
      fill.style.height = Math.max(2, ((x.minutes || 0) / maxD) * 100) + '%';
      bar.appendChild(fill);
      box.appendChild(el('div', 'vv', Math.round(x.minutes || 0) + 'm'));
      box.appendChild(bar);
      // 柱子多的时候只每 step 根标一次日期，其余留空（悬停 title 里都有）
      var showLabel = labelStep <= 1 || idx % labelStep === 0 || idx === days.length - 1;
      box.appendChild(el('div', 'lb', showLabel ? x.dateLabel : ''));
      if (x.span) box.title = x.dateLabel + ' · ' + x.span + ' 天合计 ' + Math.round(x.minutes) + ' 分钟';
      else box.title = x.dateLabel + ' · ' + Math.round(x.minutes || 0) + ' 分钟';
      tr.appendChild(box);
    });

    // 运行画像
    var tb = document.getElementById('facts');
    tb.innerHTML = '';
    function fact(k, v) {
      var row = document.createElement('tr');
      row.appendChild(el('td', 'k', k));
      row.appendChild(el('td', 'v', v));
      tb.appendChild(row);
    }
    fact('有硬件归属', d.hasHardware ? '是' : '否');
    if (d.hasHardware) {
      fact('CPU 平均', (d.cpuLoadAvg != null ? d.cpuLoadAvg.toFixed(1) + '%' : '—'));
      fact('GPU 平均', (d.gpuLoadAvg != null ? d.gpuLoadAvg.toFixed(1) + '%' : '—'));
      fact('GPU 峰值温度', (d.gpuTempMax != null ? d.gpuTempMax.toFixed(0) + ' °C' : '—'));
    }
    if (d.hasKeyMouse) {
      fact('鼠标点击', Math.round(d.mouseClicks || 0) + ' 次');
      fact('滚轮', Math.round(d.mouseScrolls || 0) + ' 次');
      if (d.mouseMoveDistance != null) fact('移动距离', Math.round(d.mouseMoveDistance) + ' px');
    }
    if (d.hasInput && d.keyPresses != null) {
      fact('按键', Math.round(d.keyPresses) + ' 次');
      if (d.keysPerHour != null) fact('每小时按键', d.keysPerHour.toFixed(1));
    }

    // 标题
    var ul = document.getElementById('titles');
    ul.innerHTML = '';
    var titles = d.topWindowTitles || [];
    if (!titles.length) ul.appendChild(el('li', 'empty', '暂无标题记录'));
    titles.forEach(function (t) { ul.appendChild(el('li', null, t)); });

    return 'ok: ' + fmtMins(d.totalMinutes) + ' / ' + (d.sessions || 0) + ' 会话';
  }

  document.getElementById('q').addEventListener('input', renderList);

  function markRange(btn) {
    var bar = document.getElementById('ranges');
    if (!bar) return;
    Array.prototype.forEach.call(bar.children, function (b) {
      b.className = (b === btn) ? 'on' : '';
    });
  }

  // 切时间范围：重拉左侧列表，选中项还在就保持，不然选第一个
  function loadApps(days, btn) {
    chosenDays = days;
    markRange(btn);
    document.getElementById('sub').textContent = rangeLabel() + ' · 正在统计…';
    window.__TAURI__.core.invoke('apps_stats', { days: days }).then(function (p) {
      APPS = (p && p.items) || [];
      renderList();
      var keep = null;
      if (CUR) {
        for (var i = 0; i < APPS.length; i++) {
          if (APPS[i].processName === CUR.processName) { keep = APPS[i]; break; }
        }
      }
      if (keep) {
        select(keep);
      } else if (APPS.length) {
        select(APPS[0]);
      } else {
        document.getElementById('sub').textContent = rangeLabel() + ' 内没有应用记录';
        window.__DETAIL_RESULT__ = 'ok: ' + 0 + ' 个应用';
      }
    }).catch(function (e) {
      document.getElementById('sub').textContent = '统计失败：' + e;
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.getElementById('ranges');
    if (!bar) return;
    Array.prototype.forEach.call(bar.children, function (b) {
      b.addEventListener('click', function () {
        loadApps(Number(b.getAttribute('data-days')) || 0, b);
      });
    });
  });

  window.renderDetail = function (payload) {
    // 用户切过范围后，外壳每分钟推来的默认（全部历史）列表不再覆盖选择
    if (chosenDays !== 0 && !(payload && payload.__explicit)) {
      return 'skip: 保持用户选择的范围';
    }
    APPS = (payload && payload.apps && payload.apps.items) || [];
    renderList();
    if (APPS.length) select(APPS[0]);
    return 'ok: ' + APPS.length + ' 个应用';
  };

  document.addEventListener('DOMContentLoaded', function () {
    if (window.__DETAIL_DATA__) {
      try { window.__DETAIL_RESULT__ = window.renderDetail(window.__DETAIL_DATA__); }
      catch (e) { window.__DETAIL_RESULT__ = 'error: ' + e.message; }
    }
  });
</script>
</body>
</html>
