<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 分析</title>
<style>#wrap { padding: 0; }
.sub { color:var(--dim); font-size:11px; margin-bottom:14px; }
.kpi .d { font-size:11px; }
.up { color:var(--green); }
.down { color:var(--red); }
.flat { color:var(--dim); }
.row { display:grid; grid-template-columns: 1.15fr .85fr; gap:14px; }
@media (max-width: 900px) { .row { grid-template-columns:1fr; } }
.cal { display:grid; grid-template-columns:repeat(14, 1fr); gap:3px; }
.cal .day { border-radius:4px; height:40px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:10px; color:var(--mute); background:var(--surface-3); }
.cal .day.in { color:var(--text); }
.cal .day .h { font-size:11px; font-weight:600; }
.cal .day .l { font-size:9px; opacity:.8; }
.heat { display:grid; grid-template-columns:repeat(24, 1fr); gap:2px; margin-top:12px; }
.heat div { height:26px; border-radius:3px; background:var(--surface-3); font-size:9px; color:var(--mute);
    display:flex; align-items:center; justify-content:center; }
.heat div.m { color:var(--text); }
ul { list-style:none; margin:0; padding:0; }
li { padding:6px 0; border-bottom:1px solid rgba(58,48,29,.55); }
li:last-child { border-bottom:0; }
.line { display:flex; justify-content:space-between; gap:8px; }
.muted { color:var(--dim); }
.share { margin-bottom:7px; }
.share .bar { height:6px; background:rgba(58,48,29,.55); border-radius:3px; overflow:hidden; margin-top:3px; }
.share .bar i { display:block; height:100%; background:var(--gold); }
.insight { padding:7px 9px; border-radius:8px; margin-bottom:6px; background:var(--surface-3); border-left:3px solid var(--gold); }
.insight.warning { border-left-color:var(--amber); }
.insight.critical { border-left-color:#ef4444; }
.insight b { display:block; font-size:11px; margin-bottom:2px; }
.insight span { color:var(--dim); font-size:11px; }  /* 效率评分 */
  .eff { display:grid; grid-template-columns:130px minmax(0,1fr) 230px; gap:18px; align-items:center; }
  @media (max-width:1000px){ .eff { grid-template-columns:1fr; } }
  .eff-score {
    font-family:var(--font-display); font-size:40px; font-weight:700; line-height:1;
    font-variant-numeric:tabular-nums;
    background:var(--grad-gold); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .eff-label { color:var(--mute); font-size:11px; margin-top:7px; line-height:1.6; }
  .eff-items { display:grid; gap:7px; }
  .eff-row { display:grid; grid-template-columns:64px 1fr 46px; gap:10px; align-items:center; font-size:11.5px; }
  .eff-row .n { color:var(--dim); }
  .eff-row .v { text-align:right; color:var(--gold-hi); font-variant-numeric:tabular-nums; }
  .eff-week { display:flex; gap:5px; align-items:flex-end; height:62px; }
  .eff-week .col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .eff-week .col i { width:100%; border-radius:3px 3px 1px 1px; min-height:2px;
    background:linear-gradient(180deg, var(--gold-hi), var(--gold-deep)); opacity:.55; }
  .eff-week .col.today i { opacity:1; }
  .eff-week .col span { font-size:9px; color:var(--mute); }
</style>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<div id="wrap">
  <h1>活动分析</h1>
  <div class="sub" id="period">等待数据…</div>

  <div class="kpis" id="kpis"></div>

  <section class="card" id="effCard" style="margin-bottom:var(--gap)">
    <h2>效率评分 <em id="effDate"></em><span class="spacer"></span><span class="pill info" id="effPill">—</span></h2>
    <div class="eff">
      <div class="eff-main">
        <div class="eff-score" id="effScore">—</div>
        <div class="eff-label" id="effLabel">等待数据…</div>
      </div>
      <div class="eff-items" id="effItems"></div>
      <div class="eff-week" id="effWeek"></div>
    </div>
    <div class="note" style="margin-top:10px">
      总分 = 专注 × 1/3 + 任务 × 5/18 + 平衡 × 2/9 + 抗打断 × 1/6。
      「任务完成」按分类名含 <b>开发 / 办公 / 生产力 / 工作</b> 的时长占比计算，
      没有这类分类时恒为 0（可在分类管理里调整命名）。
    </div>
  </section>

  <div class="row">
    <section>
      <h2>近两周每日活跃</h2>
      <div class="cal" id="cal"></div>
      <h2 style="margin-top:14px">24 小时分布（当前周期）</h2>
      <div class="heat" id="heat"></div>
    </section>
    <section>
      <h2>分类构成</h2>
      <div id="shares"></div>
      <h2 style="margin-top:14px">Top 变化</h2>
      <ul id="changes"></ul>
    </section>
  </div>

  <section style="margin-top:14px">
    <h2>洞察</h2>
    <div id="insights"></div>
  </section>
</div>
<script>
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function fmtMins(v) {
    var m = Math.round(v || 0);
    return Math.floor(m / 60) + 'h' + (m % 60) + 'm';
  }

  // 日历/热力用一个 5 档色阶，和应用里"强度"语义一致
  var LEVEL = ['#1a150d', '#3d2f14', '#6b511d', '#9c7628', '#d9b45a'];

  function dirClass(d) {
    return d === 'up' ? 'up' : (d === 'down' ? 'down' : 'flat');
  }

  /// 效率评分：总分 + 四项分项条 + 近 7 天趋势（算法见 datad::efficiency_json）
  function renderEfficiency(e) {
    var score = document.getElementById('effScore');
    var label = document.getElementById('effLabel');
    var pill = document.getElementById('effPill');
    var items = document.getElementById('effItems');
    var week = document.getElementById('effWeek');
    if (!e || e.total === undefined) {
      score.textContent = '—';
      label.textContent = '今天还没有可评分的数据';
      pill.textContent = '无数据';
      items.innerHTML = '';
      week.innerHTML = '';
      return;
    }
    var total = Number(e.total) || 0;
    score.textContent = total.toFixed(1);
    document.getElementById('effDate').textContent = '今日 · ' + (e.date || '');

    var level = total >= 80 ? ['优秀', 'good'] : total >= 65 ? ['良好', 'info']
      : total >= 50 ? ['一般', 'info'] : ['待改善', 'bad'];
    pill.textContent = level[0];
    pill.className = 'pill ' + level[1];

    label.textContent = '专注 ' + Math.round(e.focusMinutes || 0) + ' 分钟（其中深度 ' +
      Math.round(e.deepWorkMinutes || 0) + '）· 切换 ' + (e.switches || 0) + ' 次';

    var rows = [
      ['专注度', e.focus, '连续 ≥25 分钟的专注块时长占比，深度工作另加分，权重 1/3'],
      ['任务完成', e.task, '生产力类（开发/办公/生产力/工作）时长占比，权重 5/18'],
      ['劳逸平衡', e.balance, '休息占比越接近 15% 分越高，权重 2/9'],
      ['抗打断', e.interrupt, '每小时应用切换次数，越少分越高，权重 1/6']
    ];
    items.innerHTML = '';
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'eff-row';
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = r[0];
      n.title = r[2];
      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      fill.style.width = Math.max(2, Math.min(100, Number(r[1]) || 0)) + '%';
      bar.appendChild(fill);
      var v = document.createElement('span');
      v.className = 'v';
      v.textContent = (Number(r[1]) || 0).toFixed(1);
      v.title = r[2];
      row.appendChild(n); row.appendChild(bar); row.appendChild(v);
      items.appendChild(row);
    });

    week.innerHTML = '';
    (e.week || []).forEach(function (d, idx, arr) {
      var col = document.createElement('div');
      col.className = 'col' + (idx === arr.length - 1 ? ' today' : '');
      var bar = document.createElement('i');
      bar.style.height = Math.max(3, (Number(d.total) || 0)) + '%';
      bar.title = d.date + '：' + (Number(d.total) || 0).toFixed(1);
      var lb = document.createElement('span');
      lb.textContent = (d.date || '').slice(5);
      col.appendChild(bar);
      col.appendChild(lb);
      week.appendChild(col);
    });
    if (!(e.week || []).length) {
      week.innerHTML = '<span style="color:var(--mute);font-size:11px">暂无趋势</span>';
    }
  }

  function render(data) {
    if (!data) return 'error: no data';

    var period = data.period || {};
    document.getElementById('period').textContent =
      (period.label || '') + '　' + (period.start || '') + ' ~ ' + (period.endExclusive || '') +
      '　对比 ' + (data.previous && data.previous.label ? data.previous.label : '上一周期') +
      '　有数据 ' + (data.dayCountWithData || 0) + ' 天';

    // KPI
    renderEfficiency(data.efficiency);

    var kp = document.getElementById('kpis');
    kp.innerHTML = '';
    (data.kpis || []).forEach(function (k) {
      var box = el('div', 'kpi');
      box.appendChild(el('div', 'n', k.name));
      box.appendChild(el('div', 'v', k.value));
      box.appendChild(el('div', 'd ' + dirClass(k.deltaDirection), k.deltaText));
      box.title = k.hint || '';
      kp.appendChild(box);
    });

    // 14 天日历
    var cal = document.getElementById('cal');
    cal.innerHTML = '';
    (data.calendarDays || []).forEach(function (d) {
      var c = el('div', 'day' + (d.inPeriod ? ' in' : ''));
      c.style.background = d.inPeriod ? LEVEL[Math.min(4, d.intensityLevel || 0)] : '#141c2b';
      c.style.opacity = d.inPeriod ? 1 : 0.45;
      c.appendChild(el('div', 'h', fmtMins((d.hours || 0) * 60)));
      c.appendChild(el('div', 'l', d.dateLabel || ''));
      c.title = d.date + ' 周' + (d.dayLabel || '');
      cal.appendChild(c);
    });

    // 24h 热力
    var heat = document.getElementById('heat');
    heat.innerHTML = '';
    (data.hourHeat || []).forEach(function (h) {
      var cell = el('div', (h.minutes || 0) > 0 ? 'm' : '', h.label);
      cell.style.background = LEVEL[Math.min(4, h.intensityLevel || 0)];
      cell.title = h.label + ' 点 · ' + Math.round(h.minutes || 0) + ' 分钟';
      heat.appendChild(cell);
    });

    // 分类构成
    var sh = document.getElementById('shares');
    sh.innerHTML = '';
    var shares = (data.categoryShares || []);
    if (!shares.length) sh.appendChild(el('div', 'empty', '暂无分类数据'));
    var maxPct = shares.reduce(function (a, b) { return Math.max(a, b.percentage || 0); }, 1);
    shares.forEach(function (s) {
      var box = el('div', 'share');
      var line = el('div', 'line');
      line.appendChild(el('span', null, s.category));
      line.appendChild(el('span', 'muted', (s.percentage || 0).toFixed(1) + '% · ' + fmtMins(s.minutes)));
      box.appendChild(line);
      var bar = el('div', 'bar');
      var fill = el('i');
      fill.style.width = Math.max(2, (s.percentage || 0) / maxPct * 100) + '%';
      bar.appendChild(fill);
      box.appendChild(bar);
      sh.appendChild(box);
    });

    // Top 变化
    var ch = document.getElementById('changes');
    ch.innerHTML = '';
    var changes = (data.topChanges || []);
    if (!changes.length) ch.appendChild(el('li', 'empty', '暂无显著变化'));
    changes.forEach(function (c) {
      var li = el('li');
      var line = el('div', 'line');
      line.appendChild(el('span', null, c.name));
      line.appendChild(el('span', dirClass(c.direction), c.deltaText));
      li.appendChild(line);
      li.appendChild(el('div', 'muted', fmtMins(c.previousMinutes) + ' → ' + fmtMins(c.currentMinutes)));
      ch.appendChild(li);
    });

    // 洞察
    var ins = document.getElementById('insights');
    ins.innerHTML = '';
    (data.insights || []).forEach(function (i) {
      var box = el('div', 'insight ' + (i.severity || ''));
      box.appendChild(el('b', null, i.title));
      box.appendChild(el('span', null, i.message));
      ins.appendChild(box);
    });
    if (!(data.insights || []).length) ins.appendChild(el('div', 'empty', '暂无洞察'));

    return 'ok: ' + (data.kpis || []).length + ' KPI / ' + (data.insights || []).length + ' 洞察';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var d = window.__ANA_DATA__;
    if (d) { try { window.__ANA_RESULT__ = render(d); } catch (e) { window.__ANA_RESULT__ = 'error: ' + e.message; } }
  });

  window.renderAnalytics = function (d) { window.__ANA_DATA__ = d; return render(d); };
</script>
</body>
</html>
