<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 仪表盘</title>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme.css" />
<style>
  .row { display:grid; grid-template-columns:1.12fr .88fr; gap:var(--gap); align-items:start; }
  .row > div { display:flex; flex-direction:column; gap:var(--gap); }
  @media (max-width:1020px){ .row{ grid-template-columns:1fr; } }

  .hours { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; align-items:end; height:74px; }
  .hours i {
    display:block; border-radius:3px 3px 1px 1px; min-height:2px;
    background:linear-gradient(180deg, var(--gold-hi), var(--gold-deep));
    transition:filter .15s;
  }
  .hours i:hover { filter:brightness(1.25); }
  .hours i.zero { background:var(--surface-3); }
  .hlbl { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; margin-top:5px;
    font-size:11.5px; color:var(--mute); text-align:center; }

  .trend { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .trend > div { text-align:center; }
  .trend .v { font-size:11.5px; color:var(--dim); margin-bottom:3px; font-variant-numeric:tabular-nums; }
  .trend .b { height:52px; display:flex; align-items:flex-end; }
  .trend .b i { display:block; width:100%; border-radius:4px 4px 2px 2px; min-height:3px;
    background:linear-gradient(180deg, var(--gold-hi), var(--gold-deep)); }
  .trend > div.today .b i { background:linear-gradient(180deg, var(--cyan), var(--gold-deep)); }
  .trend .l { font-size:11.5px; color:var(--mute); margin-top:4px; }

  .hwgrid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
  @media (max-width:1020px){ .hwgrid{ grid-template-columns:1fr; } }
  #hc { width:100%; height:196px; display:block; }
</style>
</head>
<body>
<header class="page-head">
  <h1>仪表盘</h1>
  <div class="sub" id="meta">加载中…</div>
  <div class="grow"></div>
  <span class="pill info" id="hwPill">硬件采样</span>
</header>

<div class="kpis" id="kpis"></div>

<div class="row">
  <div>
    <section class="card">
      <h2>今日应用排行 <em>Top 8 · 按活跃时长</em></h2>
      <table>
        <thead><tr><th>应用</th><th class="r">时长</th><th class="r">占比</th></tr></thead>
        <tbody id="apps"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>24 小时活跃 <em>按会话开始时间累计分钟</em></h2>
      <div class="hours" id="hours"></div>
      <div class="hlbl" id="hlbl"></div>
    </section>
  </div>

  <div>
    <section class="card">
      <h2>近 7 天 <em>活跃分钟</em></h2>
      <div class="trend" id="trend"></div>
    </section>

    <section class="card">
      <h2>今日节奏</h2>
      <table>
        <thead><tr><th>项目</th><th class="r">值</th></tr></thead>
        <tbody id="pace"></tbody>
      </table>
    </section>
  </div>
</div>

<section class="card hw" style="margin-top:var(--gap)">
  <h2>硬件趋势 <em id="hwMeta">近 7 天 · 按小时（CPU / GPU / 温度）</em></h2>
  <div class="hwgrid">
    <div>
      <canvas id="hc"></canvas>
      <div class="legend">
        <span><i class="dot" style="background:var(--gold)"></i>CPU %</span>
        <span><i class="dot" style="background:var(--cyan)"></i>GPU %</span>
        <span><i class="dot" style="background:var(--red)"></i>GPU 温度（右轴）</span>
      </div>
    </div>
    <div>
      <table>
        <thead><tr><th>高负载应用</th><th class="r">CPU</th><th class="r">GPU</th><th class="r">峰温</th></tr></thead>
        <tbody id="hwapps"></tbody>
      </table>
    </div>
  </div>
</section>

<script>
  function fmtM(v) {
    var m = Math.round(v || 0);
    if (m < 60) return m + ' 分钟';
    if (m < 1440) return Math.floor(m / 60) + 'h' + (m % 60) + 'm';
    return Math.round(m / 60) + ' 小时';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function n0(v) { return (v == null ? '—' : Math.round(v) + '%'); }

  var HW_HOURS = [];
  window.addEventListener('resize', function () { drawHardware(HW_HOURS); });

  // 硬件趋势：CPU 面积 + GPU 折线 + 温度虚线（右轴）
  // canvas 颜色跟随 tokens.css（浅色主题下金色曲线在白底上看不清，必须动态取）
  function cssVar(name, fb) {
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fb;
    } catch (e) { return fb; }
  }
  function hexToRgba(hex, alpha) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return 'rgba(217,180,90,' + alpha + ')';
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function drawHardware(hours) {
    var cv = document.getElementById('hc');
    if (!cv || !cv.getContext) return;
    var dpr = window.devicePixelRatio || 1;
    var cssW = Math.max(320, cv.clientWidth || 860);
    var cssH = 196;
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.font = '10px "Segoe UI","Microsoft YaHei",sans-serif';

    if (!hours || !hours.length) {
      ctx.fillStyle = cssVar('--mute', '#7e7464');
      ctx.fillText('暂无硬件样本', 14, 26);
      return;
    }

    var padL = 40, padR = 44, padT = 14, padB = 24;
    var plotW = cssW - padL - padR, plotH = cssH - padT - padB;
    var temps = hours.map(function (h) { return h.temp; })
      .filter(function (t) { return t != null; });
    var maxTemp = temps.length
      ? Math.max(100, Math.ceil(Math.max.apply(null, temps) / 10) * 10) : 100;

    // 网格 + 刻度
    for (var g = 0; g <= 4; g++) {
      var y = padT + plotH * g / 4;
      ctx.strokeStyle = cssVar('--grid', 'rgba(217,180,90,0.08)');
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      ctx.fillStyle = cssVar('--mute', '#7e7464');
      ctx.fillText(Math.round(100 * (1 - g / 4)) + '%', 8, y + 3);
      ctx.fillText(Math.round(maxTemp * (1 - g / 4)) + '°', cssW - 32, y + 3);
    }

    var n = hours.length;
    var step = plotW / Math.max(n, 1);
    function xAt(i) { return padL + step * i + step / 2; }
    function yAt(v, scaleMax) { return padT + plotH * (1 - Math.min(v, scaleMax) / scaleMax); }

    // CPU 面积（渐变）
    var pts = [];
    for (var i = 0; i < n; i++) {
      var c = hours[i].cpu;
      if (c == null) continue;
      pts.push([xAt(i), yAt(c, 100)]);
    }
    if (pts.length > 1) {
      var grd = ctx.createLinearGradient(0, padT, 0, padT + plotH);
      grd.addColorStop(0, hexToRgba(cssVar('--gold', '#d9b45a'), 0.32));
      grd.addColorStop(1, hexToRgba(cssVar('--gold', '#d9b45a'), 0.03));
      ctx.beginPath();
      ctx.moveTo(pts[0][0], padT + plotH);
      pts.forEach(function (p) { ctx.lineTo(p[0], p[1]); });
      ctx.lineTo(pts[pts.length - 1][0], padT + plotH);
      ctx.closePath();
      ctx.fillStyle = grd;
      ctx.fill();

      ctx.beginPath();
      pts.forEach(function (p, k) { k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
      ctx.strokeStyle = cssVar('--gold', '#d9b45a');
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // GPU 折线
    ctx.beginPath();
    var started = false;
    for (var j = 0; j < n; j++) {
      var gv = hours[j].gpu;
      if (gv == null) continue;
      if (!started) { ctx.moveTo(xAt(j), yAt(gv, 100)); started = true; }
      else ctx.lineTo(xAt(j), yAt(gv, 100));
    }
    ctx.strokeStyle = cssVar('--cyan', '#5fb3c4');
    ctx.lineWidth = 2;
    ctx.stroke();

    // 温度虚线（右轴）
    ctx.beginPath();
    var t0 = false;
    for (var k2 = 0; k2 < n; k2++) {
      var tv = hours[k2].temp;
      if (tv == null) continue;
      if (!t0) { ctx.moveTo(xAt(k2), yAt(tv, maxTemp)); t0 = true; }
      else ctx.lineTo(xAt(k2), yAt(tv, maxTemp));
    }
    ctx.strokeStyle = hexToRgba(cssVar('--red', '#e0665f'), 0.9);
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 横轴标签（稀疏）
    ctx.fillStyle = '#7e7464';
    var every = Math.ceil(n / 12);
    for (var m = 0; m < n; m++) {
      if (m % every !== 0) continue;
      var lab = hours[m].label || String(m);
      ctx.fillText(lab, xAt(m) - 6, cssH - 7);
    }
  }

  function renderDashboard(d) {
    if (!d || d.ok === false) {
      document.getElementById('meta').textContent = '读取失败：' + ((d && d.error) || '未知错误');
      return 'error';
    }
    document.getElementById('meta').textContent =
      (d.label || '') + ' ' + (d.weekday || '') + '　·　' + (d.ms ? d.ms.toFixed(0) + ' ms' : '');

    var delta = d.deltaPercent;
    var deltaTxt = (delta == null) ? '' : (delta > 0 ? '+' : '') + delta.toFixed(1) + '% 较昨日';

    var kp = document.getElementById('kpis');
    kp.innerHTML = '';
    var goal = window.__GOAL_HOURS__ || 0;
    var goalPct = goal > 0 ? Math.round((d.totalMinutes / (goal * 60)) * 100) : 0;
    var rows = [];
    if (goal > 0) {
      rows.push(['今日目标', fmtM(goal * 60), goalPct + '% 已完成' +
        (goalPct >= 100 ? '（已达标）' : '')]);
    }
    rows = rows.concat([
      ['活跃总时长', fmtM(d.totalMinutes), deltaTxt || '含并行会话'],
      ['使用应用', d.appCount + ' 个', d.sessions + ' 次会话'],
      ['专注时段', d.focusCount + ' 段', '≥ 25 分钟连续'],
      ['键盘', (d.keys || 0).toLocaleString(), '次按键'],
      ['鼠标点击', (d.clicks || 0).toLocaleString(), '次'],
      ['滚动', (d.scroll || 0).toLocaleString(), '格'],
      ['网页时长', fmtM(d.webMinutes), '含并行标签页'],
      ['网络下行', d.netDownText || '-', '上行 ' + (d.netUpText || '-')],
      ['CPU 均值', n0(d.cpuLoadAvg), '今日硬件采样'],
      ['GPU 均值', n0(d.gpuLoadAvg), '今日硬件采样'],
      ['GPU 峰值温度', (d.gpuTempMax == null ? '—' : d.gpuTempMax.toFixed(0) + ' °C'), '今日最高'],
      ['首个 / 最近活跃', (d.firstActive || '—') + ' → ' + (d.lastActive || '—'),
        d.recent && d.recent.app ? '最近 ' + d.recent.app + ' ' + d.recent.at : ''],
    ]);
    rows.forEach(function (k) {
      var b = el('div', 'kpi');
      b.appendChild(el('div', 'n', k[0]));
      var v = el('div', 'v', k[1]);
      if (String(k[1]).length > 10) { v.style.fontSize = '15px'; v.title = k[1]; }
      b.appendChild(v);
      b.appendChild(el('div', 's', k[2]));
      kp.appendChild(b);
    });

    // Top 应用（占比列带一条细进度）
    var tb = document.getElementById('apps');
    tb.innerHTML = '';
    var apps = d.topApps || [];
    if (!apps.length) {
      var tr0 = document.createElement('tr');
      var td0 = el('td', 'empty', '今天还没有应用会话');
      td0.colSpan = 3; tr0.appendChild(td0); tb.appendChild(tr0);
    }
    apps.forEach(function (a) {
      var tr = document.createElement('tr');
      tr.appendChild(el('td', 'nm', a.name));
      tr.appendChild(el('td', 'r', fmtM(a.minutes)));
      var tdS = el('td', 'r', (a.share || 0).toFixed(1) + '%');
      var bar = el('div', 'pbar');
      bar.style.cssText = 'margin-top:4px;width:64px;margin-left:auto';
      var fill = el('i');
      fill.style.width = Math.max(2, Math.min(100, a.share || 0)) + '%';
      bar.appendChild(fill);
      tdS.appendChild(bar);
      tr.appendChild(tdS);
      tb.appendChild(tr);
    });

    // 24 小时
    var hours = document.getElementById('hours');
    var hlbl = document.getElementById('hlbl');
    hours.innerHTML = ''; hlbl.innerHTML = '';
    var arr = Array.isArray(d.hourly) ? d.hourly : [];
    var hourWarn = '';
    if (arr.length !== 24) {
      hourWarn += ' [hourly 长度 ' + arr.length + ']';
    } else if (arr.every(function (h) { return !h; }) && (d.totalMinutes || 0) > 0) {
      hourWarn += ' [hourly 全 0 但总时长 ' + Math.round(d.totalMinutes) + ' 分]';
    }
    var maxV = arr.reduce(function (m2, h) { return Math.max(m2, h || 0); }, 1) || 1;
    arr.forEach(function (h, i) {
      var bar2 = el('i', (h || 0) > 0 ? null : 'zero');
      bar2.style.height = Math.max(2, ((h || 0) / maxV) * 66) + 'px';
      bar2.title = i + ':00 · ' + fmtM(h);
      hours.appendChild(bar2);
      hlbl.appendChild(el('span', null, i % 3 === 0 ? String(i) : ''));
    });

    // 7 天趋势（今天用绿色高亮）
    var tr2 = document.getElementById('trend');
    tr2.innerHTML = '';
    var trend = Array.isArray(d.trend) ? d.trend : [];
    if (trend.length !== 7) hourWarn += ' [trend 长度 ' + trend.length + ']';
    var maxD = trend.reduce(function (m3, x) { return Math.max(m3, x.minutes || 0); }, 1) || 1;
    var lastIdx = trend.length - 1;
    trend.forEach(function (x, idx) {
      var box = el('div', idx === lastIdx ? 'today' : '');
      box.appendChild(el('div', 'v', fmtM(x.minutes)));
      var b = el('div', 'b');
      var fill = el('i');
      fill.style.height = Math.max(3, ((x.minutes || 0) / maxD) * 50) + 'px';
      b.appendChild(fill);
      box.appendChild(b);
      box.appendChild(el('div', 'l', x.label || ''));
      box.title = (x.date || '') + ' · 来源 ' + (x.source || '');
      tr2.appendChild(box);
    });

    // 今日节奏
    var pace = document.getElementById('pace');
    pace.innerHTML = '';
    [
      ['活跃分钟 / 昨日', Math.round(d.totalMinutes) + ' / ' + Math.round(d.yesterdayMinutes || 0)],
      ['会话数', (d.sessions || 0).toLocaleString()],
      ['应用数', (d.appCount || 0).toLocaleString()],
      ['专注段', (d.focusCount || 0).toLocaleString()],
      ['网页分钟', Math.round(d.webMinutes || 0).toLocaleString()],
      ['键盘 / 点击 / 滚动', (d.keys || 0) + ' / ' + (d.clicks || 0) + ' / ' + (d.scroll || 0)],
      ['最近活动', (d.recent && d.recent.app ? d.recent.app + ' ' + d.recent.at : '—')],
    ].forEach(function (r) {
      var tr = document.createElement('tr');
      tr.appendChild(el('td', null, r[0]));
      tr.appendChild(el('td', 'r', String(r[1])));
      pace.appendChild(tr);
    });

    // 硬件趋势（原独立「硬件趋势」页已并入这里）
    var hw = d.hw || {};
    var hwHours = Array.isArray(hw.hours) ? hw.hours : [];
    document.getElementById('hwMeta').textContent =
      hw.summary || (hwHours.length ? hwHours.length + ' 个小时桶' : '暂无硬件样本');
    var pill = document.getElementById('hwPill');
    if (pill) {
      pill.textContent = hwHours.length ? '近 7 天 ' + hwHours.length + ' 个小时桶' : '暂无硬件样本';
      pill.className = 'pill ' + (hwHours.length ? 'good' : 'bad');
    }
    HW_HOURS = hwHours;
    drawHardware(hwHours);

    var ha = document.getElementById('hwapps');
    ha.innerHTML = '';
    var hwApps = d.hwApps || [];
    if (!hwApps.length) {
      var htr0 = document.createElement('tr');
      var htd0 = el('td', 'empty', '最近 7 天没有硬件样本');
      htd0.colSpan = 4; htr0.appendChild(htd0); ha.appendChild(htr0);
    }
    hwApps.forEach(function (a) {
      var tr = document.createElement('tr');
      tr.appendChild(el('td', 'nm', a.displayName || a.processName || '—'));
      tr.appendChild(el('td', 'r', n0(a.cpuLoadAvg)));
      tr.appendChild(el('td', 'r', n0(a.gpuLoadAvg)));
      tr.appendChild(el('td', 'r', a.gpuTempMax == null ? '—' : a.gpuTempMax.toFixed(0) + '°'));
      tr.title = (a.processName || '') + ' · 重叠 ' + Math.round(a.overlapMinutes || 0) +
        ' 分钟 · 样本 ' + (a.sampleCount || 0);
      ha.appendChild(tr);
    });

    return 'ok: ' + fmtM(d.totalMinutes) + ' / ' + d.appCount + ' 应用 / ' +
      (d.keys || 0) + ' 键 / 硬件 ' + hwHours.length + ' 桶' + hourWarn;
  }

  window.renderDashboard = renderDashboard;
  document.addEventListener('DOMContentLoaded', function () {
    // 样式是否真的加载了（theme.css 走 asset 协议，出错会静默变成"裸页面"，这里留一条日志）
    try {
      var sheets = document.styleSheets.length;
      var themed = getComputedStyle(document.body).backgroundColor;
      if (window.__TAURI__) {
        window.__TAURI__.core.invoke('note', {
          msg: 'dashboard 样式表 ' + sheets + ' 张 · body 底色 ' + themed
        });
      }
    } catch (e) {}
    if (window.__DASH_DATA__) {
      try { window.__DASH_RESULT__ = renderDashboard(window.__DASH_DATA__); }
      catch (e) { window.__DASH_RESULT__ = 'error: ' + e.message; }
    }
  });
</script>
</body>
</html>
