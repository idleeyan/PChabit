<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 键鼠活动</title>
<style>.hint { color:var(--dim); font-size:11px; }
.ranges { display:flex; gap:6px; margin:-4px 0 12px; }
.ranges button { background:var(--surface-3); border:1px solid var(--border); color:var(--dim); border-radius:6px;
    padding:3px 10px; font-size:11px; cursor:pointer; font-family:inherit; }
.ranges button:hover { border-color:var(--gold); color:var(--text); }
.ranges button.on { background:var(--gold-soft); border-color:var(--gold); color:var(--text); }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
@media (max-width:900px){ .row{ grid-template-columns:1fr; } }
thead th.r, td.r { text-align:right; }
.hours { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; align-items:end; height:70px; }
.hours .col { display:flex; flex-direction:column; justify-content:flex-end; gap:1px; height:70px; }
.hours .col i { display:block; border-radius:2px; min-height:1px; }
.kbar { background:var(--gold); }
.cbar { background:var(--amber); }
.hlbl { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; margin-top:2px;
    font-size:9px; color:var(--mute); text-align:center; }
.legend { display:flex; gap:12px; font-size:10px; color:var(--dim); margin-bottom:6px; }
.legend b { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
.note { color:var(--mute); font-size:10px; margin-top:6px; }</style>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<header>
  <h1>键鼠活动</h1>
  <span class="hint" id="meta">加载中…</span>
</header>

<div class="ranges" id="ranges">
  <button data-days="0" class="on">全部历史</button>
  <button data-days="1">今日</button>
  <button data-days="7">近 7 天</button>
  <button data-days="30">近 30 天</button>
  <button data-days="90">近 90 天</button>
</div>

<div class="kpis" id="kpis"></div>
<div class="hint" id="note" style="margin-bottom:12px;line-height:1.5"></div>

<section style="margin-bottom:12px">
  <h2>24 小时分布 <em>键盘（蓝）/ 点击（橙）</em></h2>
  <div class="legend">
    <span><b style="background:#d9b45a"></b>按键</span>
    <span><b style="background:#c98b4b"></b>点击</span>
  </div>
  <div class="hours" id="hours"></div>
  <div class="hlbl" id="hlbl"></div>
</section>

<div class="row">
  <section>
    <h2>键盘排行 <em>按按键数</em></h2>
    <table><thead><tr><th>应用</th><th class="r">按键</th><th class="r">占比</th></tr></thead>
      <tbody id="topkeys"></tbody></table>
  </section>
  <section>
    <h2>点击排行 <em>按点击数</em></h2>
    <table><thead><tr><th>应用</th><th class="r">点击</th><th class="r">占比</th></tr></thead>
      <tbody id="topclicks"></tbody></table>
    <div class="note" id="movenote"></div>
  </section>
</div>

<div class="row">
  <section>
    <h2>具体键位 <em>按按键次数</em></h2>
    <table><thead><tr><th>按键</th><th class="r">次数</th><th class="r">占全部</th></tr></thead>
      <tbody id="keyfreq"></tbody></table>
  </section>
  <section>
    <h2>组合键 <em>Ctrl / Alt / Win 组合</em></h2>
    <table><thead><tr><th>组合</th><th class="r">次数</th><th class="r">占全部</th></tr></thead>
      <tbody id="shortcuts"></tbody></table>
  </section>
</div>

<script>
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function n(v) { return (v || 0).toLocaleString(); }

  function renderInput(d) {
    if (!d || d.ok === false) {
      document.getElementById('meta').textContent = '读取失败：' + ((d && d.error) || '未知错误');
      return 'error';
    }
    // 用户点过范围按钮后，忽略外壳 60 秒推来的默认口径
    if (chosenDays !== 0 && !d.__explicit) return 'skip: 保持用户选择的范围';
    var rg = d.range || {};
    document.getElementById('meta').textContent =
      (rg.start || '') + ' ~ ' + (rg.end || '') + '　' + (d.ms ? d.ms.toFixed(0) + ' ms' : '') +
      '　' + (d.keyRows || 0) + ' 行键盘记录';

    var kp = document.getElementById('kpis');
    kp.innerHTML = '';
    var scopeTxt = (d.days && d.days > 0)
      ? (d.days === 1 ? '今日' : ('近 ' + d.days + ' 天'))
      : '全部历史';
    [
      ['按键总数', n(d.keys), scopeTxt + ' · 不含修饰键/长按重复'],
      ['长按重复', n(d.repeat || 0), '按住不放的自动重复'],
      ['鼠标点击', n(d.clicks), '左/右/中合计'],
      ['左键', n(d.leftClicks), '单击'],
      ['右键', n(d.rightClicks), '单击'],
      ['中键', n(d.middleClicks), '滚轮按下'],
      ['滚轮格数', n(d.scroll), '所有应用'],
      ['打字爆发', n(d.bursts), '连续输入段'],
      ['每小时按键', (d.keysPerHour || 0).toFixed(0), '平均'],
      ['鼠标位移', d.moveText || '0.0 米', '采样来自鼠标钩子'],
      ['移动事件', n(d.moveEvents), '次'],
    ].forEach(function (k) {
      var b = el('div', 'kpi');
      b.appendChild(el('div', 'n', k[0]));
      b.appendChild(el('div', 'v', k[1]));
      b.appendChild(el('div', 's', k[2]));
      kp.appendChild(b);
    });

    var note = document.getElementById('note');
    if (note) {
      note.textContent = '口径：按键总数只统计「非修饰键、非按住自动重复」的按下次数；'
        + '提权（以管理员身份运行）窗口与 UAC 安全桌面里的输入，普通权限的钩子拿不到，会漏计。';
    }

    // 24 小时双柱
    var hours = document.getElementById('hours');
    var hlbl = document.getElementById('hlbl');
    hours.innerHTML = ''; hlbl.innerHTML = '';
    var ks = d.hourlyKeys || [];
    var cs = d.hourlyClicks || [];
    var maxV = Math.max(
      ks.reduce(function (m, x) { return Math.max(m, x || 0); }, 1),
      cs.reduce(function (m, x) { return Math.max(m, x || 0); }, 1)
    ) || 1;
    for (var i = 0; i < 24; i++) {
      var col = el('div', 'col');
      var kb = el('i', 'kbar');
      kb.style.height = Math.max((ks[i] || 0) > 0 ? 2 : 1, ((ks[i] || 0) / maxV) * 56) + 'px';
      if (!ks[i]) kb.style.background = '#182234';
      kb.title = i + ':00 按键 ' + n(ks[i]);
      var cb = el('i', 'cbar');
      cb.style.height = Math.max((cs[i] || 0) > 0 ? 2 : 1, ((cs[i] || 0) / maxV) * 56) + 'px';
      if (!cs[i]) cb.style.background = '#182234';
      cb.title = i + ':00 点击 ' + n(cs[i]);
      col.appendChild(kb);
      col.appendChild(cb);
      col.title = i + ':00 · 键 ' + n(ks[i]) + ' / 击 ' + n(cs[i]);
      hours.appendChild(col);
      hlbl.appendChild(el('span', null, i % 3 === 0 ? String(i) : ''));
    }

    // 排行
    [['topkeys', d.topKeys, 'keys', d.keys], ['topclicks', d.topClicks, 'clicks', d.clicks]].forEach(function (cfg) {
      var tb = document.getElementById(cfg[0]);
      tb.innerHTML = '';
      var arr = cfg[1] || [];
      if (!arr.length) {
        var tr0 = document.createElement('tr');
        var td0 = el('td', 'empty', '这段时间没有记录');
        td0.colSpan = 3; tr0.appendChild(td0); tb.appendChild(tr0);
        return;
      }
      // 分母用总量（不是最大值），这样「占比」加起来才是 100%
      var denom = Math.max(cfg[3] || 0, 1);
      arr.forEach(function (x) {
        var tr = document.createElement('tr');
        tr.appendChild(el('td', 'nm', x.name));
        tr.appendChild(el('td', 'r', n(x[cfg[2]])));
        tr.appendChild(el('td', 'r', ((x[cfg[2]] / denom) * 100).toFixed(1) + '%'));
        tb.appendChild(tr);
      });
    });

    document.getElementById('movenote').textContent =
      d.moveDistance > 0
        ? '鼠标位移 ' + d.moveText + '（按 96 DPI 粗算）'
        : '当前数据库里鼠标位移全为 0：键鼠钩子在部署版里未产出位移，属采集侧限制，不是页面问题。';

    // 具体键位 / 组合键
    [['keyfreq', d.keyFreq, d.keys], ['shortcuts', d.shortcuts, d.keys]].forEach(function (cfg) {
      var tb = document.getElementById(cfg[0]);
      tb.innerHTML = '';
      var arr = cfg[1] || [];
      if (!arr.length) {
        var tr0 = document.createElement('tr');
        var td0 = el('td', 'empty', '这段时间没有记录（旧数据只在总按键数里，键位分布从 4.12.20 起才有）');
        td0.colSpan = 3; tr0.appendChild(td0); tb.appendChild(tr0);
        return;
      }
      var total = Math.max(cfg[2] || 0, 1);
      arr.forEach(function (x) {
        var tr = document.createElement('tr');
        tr.appendChild(el('td', 'nm', x.name));
        tr.appendChild(el('td', 'r', n(x.count)));
        tr.appendChild(el('td', 'r', ((x.count / total) * 100).toFixed(2) + '%'));
        tb.appendChild(tr);
      });
    });

    return 'ok: ' + n(d.keys) + ' 键 / ' + n(d.clicks) + ' 击 / ' + n(d.scroll) + ' 滚';
  }

  window.renderInput = renderInput;

  var chosenDays = 0;          // 0 = 全部历史
  function pickRange(days, btn) {
    chosenDays = days;
    var bar = document.getElementById('ranges');
    if (bar) {
      Array.prototype.forEach.call(bar.children, function (b) {
        b.className = (b === btn) ? 'on' : '';
      });
    }
    var meta = document.getElementById('meta');
    if (!window.__TAURI__ || !window.__TAURI__.core) { return; }
    meta.textContent = '读取中…';
    window.__TAURI__.core.invoke('input_data', { days: days }).then(function (d) {
      d.__explicit = true;
      window.__INPUT_DATA__ = d;
      window.__INPUT_RESULT__ = renderInput(d);
    }).catch(function (e) {
      meta.textContent = '读取失败：' + e;
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.getElementById('ranges');
    if (bar) {
      Array.prototype.forEach.call(bar.children, function (b) {
        b.addEventListener('click', function () {
          pickRange(Number(b.getAttribute('data-days')) || 0, b);
        });
      });
    }
    if (window.__INPUT_DATA__) {
      try { window.__INPUT_RESULT__ = renderInput(window.__INPUT_DATA__); }
      catch (e) { window.__INPUT_RESULT__ = 'error: ' + e.message; }
    }
  });
</script>
</body>
</html>
