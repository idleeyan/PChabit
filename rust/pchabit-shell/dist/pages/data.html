<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 数据概览</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; background:#0f172a; color:#e2e8f0;
    font:12px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; padding:14px 16px 24px; }
  header { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  h1 { font-size:15px; font-weight:600; margin:0; }
  .hint { color:#94a3b8; font-size:11px; word-break:break-all; }

  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-bottom:14px; }
  .kpi { background:#141e30; border:1px solid #223049; border-radius:9px; padding:8px 10px; }
  .kpi .n { color:#94a3b8; font-size:10px; }
  .kpi .v { font-size:15px; font-weight:600; }
  .kpi .s { color:#64748b; font-size:10px; margin-top:1px; }

  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  @media (max-width:900px){ .row{ grid-template-columns:1fr; } }
  section { background:#121a29; border:1px solid #223049; border-radius:10px; padding:10px 12px; }
  section h2 { font-size:12px; font-weight:600; margin:0 0 8px; color:#cbd5e1;
    display:flex; align-items:center; gap:8px; }
  section h2 em { font-style:normal; color:#64748b; font-weight:400; font-size:10px; }

  table { width:100%; border-collapse:collapse; }
  thead th { text-align:left; font-weight:500; color:#64748b; font-size:10px; padding:2px 6px 5px;
    border-bottom:1px solid #223049; white-space:nowrap; }
  thead th.r, td.r { text-align:right; }
  tbody td { padding:3px 6px; border-bottom:1px solid #1a2436; font-size:11.5px; }
  tbody tr:hover { background:#16233a; }
  .tb { color:#93c5fd; }
  .ok { color:#22c55e; }
  .bad { color:#f87171; }
  .note { color:#64748b; font-size:10px; margin-top:8px; }
  .empty { color:#64748b; padding:8px 0; }
</style>
</head>
<body>
<header>
  <h1>数据概览</h1>
  <span class="hint" id="meta">加载中…</span>
</header>

<div class="kpis" id="kpis"></div>

<div class="row">
  <section>
    <h2>数据表 <em id="tn"></em></h2>
    <table><thead><tr><th>表</th><th class="r">行数</th></tr></thead>
      <tbody id="tables"></tbody></table>
    <div class="note">只读统计 · 下方「立即备份 / 清理旧数据」由壳直接执行（写库，等价 WPF 的同名操作）</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <button id="btnBackup" style="padding:4px 10px;border-radius:6px;border:1px solid #223049;
        background:#1d4ed8;color:#fff;cursor:pointer">立即备份</button>
      <button id="btnClean" style="padding:4px 10px;border-radius:6px;border:1px solid #223049;
        background:#7c2d12;color:#fff;cursor:pointer">清理旧数据</button>
      <span class="hint" id="actMsg"></span>
    </div>
  </section>

  <section>
    <h2>最近备份 <em id="bn"></em></h2>
    <table><thead><tr><th>文件</th><th class="r">大小</th><th class="r">时间</th></tr></thead>
      <tbody id="backups"></tbody></table>
  </section>
</div>

<section style="margin-top:12px">
  <h2>WebDAV 手动同步 <em id="davInfo">未读取</em></h2>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button id="btnDavUp" style="padding:4px 10px;border-radius:6px;border:1px solid #223049;
      background:#0f766e;color:#fff;cursor:pointer">上传备份到云端</button>
    <button id="btnDavDown" style="padding:4px 10px;border-radius:6px;border:1px solid #223049;
      background:#1e3a8a;color:#fff;cursor:pointer">下载云端最新备份</button>
    <button id="btnNotesSync" style="padding:4px 10px;border-radius:6px;border:1px solid #223049;
      background:#3730a3;color:#fff;cursor:pointer">同步便签</button>
    <button id="btnDavInfo" style="padding:4px 10px;border-radius:6px;border:1px solid #263349;
      background:#182234;color:#cbd5e1;cursor:pointer">查看云端状态</button>
    <span class="hint" id="davMsg"></span>
  </div>
  <div class="note">需要先在「设置 → 网络与同步」填 WebDAV 地址 / 账号 / 密码并勾上「WebDAV 同步」；
    上传=把最新本地备份 PUT 到云端并按「云端保留份数」清理旧文件，下载=把云端最新一份落到临时目录（不覆盖当前库），
    便签同步=远端 pchabit_notes.json 与本地按 Id 合并（更新更晚的赢）后整份传回</div>
</section>

<script>
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function n(v) { return (v || 0).toLocaleString(); }

  function renderData(d) {
    if (!d || d.ok === false) {
      document.getElementById('meta').textContent = '读取失败：' + ((d && d.error) || '未知错误');
      return 'error';
    }
    document.getElementById('meta').textContent =
      d.path || '';

    var kp = document.getElementById('kpis');
    kp.innerHTML = '';
    var tables = d.tables || [];
    var totalRows = tables.reduce(function (s, t) { return s + (t.rows || 0); }, 0);
    [
      ['数据库文件', d.sizeText || '-', '主库'],
      ['WAL 日志', d.walText || '-', '未 checkpoint'],
      ['共享内存', d.shmText || '-', '-shm'],
      ['合计占用', d.totalText || '-', '库 + wal + shm'],
      ['数据表', tables.length + ' 张', '全部行数 ' + n(totalRows)],
      ['备份记录', (d.backups || []).length + ' 条', '最近 10 条'],
      ['统计耗时', (d.ms || 0).toFixed(0) + ' ms', '壳内 Rust 直读'],
    ].forEach(function (k) {
      var b = el('div', 'kpi');
      b.appendChild(el('div', 'n', k[0]));
      b.appendChild(el('div', 'v', k[1]));
      b.appendChild(el('div', 's', k[2]));
      kp.appendChild(b);
    });

    var tb = document.getElementById('tables');
    tb.innerHTML = '';
    document.getElementById('tn').textContent = tables.length + ' 张表';
    if (!tables.length) {
      var tr0 = document.createElement('tr');
      var td0 = el('td', 'empty', '没有读到数据表');
      td0.colSpan = 2; tr0.appendChild(td0); tb.appendChild(tr0);
    }
    var maxR = tables.reduce(function (m, t) { return Math.max(m, t.rows || 0); }, 1) || 1;
    tables.forEach(function (t) {
      var tr = document.createElement('tr');
      var td = el('td');
      td.appendChild(el('span', 'tb', t.table));
      td.title = n(t.rows) + ' 行';
      var bar = document.createElement('div');
      bar.style.cssText = 'height:3px;background:#1e3a5f;border-radius:2px;margin-top:3px;';
      var fill = el('i');
      fill.style.cssText = 'display:block;height:3px;background:#3b82f6;border-radius:2px;' +
        'width:' + Math.max(2, ((t.rows || 0) / maxR) * 100) + '%';
      bar.appendChild(fill);
      td.appendChild(bar);
      tr.appendChild(td);
      tr.appendChild(el('td', 'r', n(t.rows)));
      tb.appendChild(tr);
    });

    var bt = document.getElementById('backups');
    bt.innerHTML = '';
    var backups = d.backups || [];
    document.getElementById('bn').textContent = backups.length + ' 条';
    if (!backups.length) {
      var tr1 = document.createElement('tr');
      var td1 = el('td', 'empty', '还没有备份记录');
      td1.colSpan = 3; tr1.appendChild(td1); bt.appendChild(tr1);
    }
    backups.forEach(function (b) {
      var tr = document.createElement('tr');
      var td = el('td');
      var name = String(b.path || '').split('\\').pop();
      td.appendChild(el('span', b.exists ? 'ok' : 'bad', name));
      td.title = (b.path || '') + (b.exists ? '' : '（文件已不存在）') +
        (b.automatic ? ' · 自动' : ' · 手动') + (b.description ? ' · ' + b.description : '');
      tr.appendChild(td);
      tr.appendChild(el('td', 'r', b.sizeText || '-'));
      tr.appendChild(el('td', 'r', String(b.createdAt || '').slice(5, 16)));
      bt.appendChild(tr);
    });

    return 'ok: ' + tables.length + ' 表 / ' + (d.sizeText || '') + ' / ' +
      backups.length + ' 备份';
  }

  window.renderData = renderData;

  // 立即备份 / 清理旧数据：由壳直接写库（VACUUM INTO / 按保留天数 DELETE）
  function act(kind) {
    var msg = document.getElementById('actMsg');
    if (!window.__TAURI__) { msg.textContent = '壳未注入 IPC，无法执行'; return; }
    msg.textContent = '执行中…';
    var call = kind === 'backup'
      ? window.__TAURI__.core.invoke('backup_db', {})
      : window.__TAURI__.core.invoke('cleanup_data', { days: 180 });
    call.then(function (r) {
      msg.textContent = String(r);
      window.__DATA_RESULT__ = 'action: ' + r;
    }).catch(function (e) {
      msg.textContent = '失败：' + e;
      window.__DATA_RESULT__ = 'action-error: ' + e;
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.getElementById('btnBackup');
    var c = document.getElementById('btnClean');
    if (b) b.addEventListener('click', function () { act('backup'); });
    if (c) c.addEventListener('click', function () { act('clean'); });

    // WebDAV 手动同步
    function davMsg(t) {
      var m = document.getElementById('davMsg');
      if (m) m.textContent = t;
      window.__DATA_RESULT__ = 'dav: ' + t;
    }
    function davInfo() {
      if (!window.__TAURI__) return;
      window.__TAURI__.core.invoke('cloud_latest_info').then(function (r) {
        var el2 = document.getElementById('davInfo');
        if (!el2) return;
        el2.textContent = (r && r.enabled ? '已启用' : '未启用') +
          (r && r.latest ? ' · 云端最新 ' + r.latest : ' · 云端无备份') +
          (r && r.lastSync ? ' · 上次同步 ' + r.lastSync : '') +
          (r && r.ok === false && r.error ? ' · ' + r.error : '');
      }).catch(function (e) {
        var el2 = document.getElementById('davInfo');
        if (el2) el2.textContent = '读取失败：' + e;
      });
    }
    function davAct(kind) {
      if (!window.__TAURI__) { davMsg('壳未注入 IPC，无法执行'); return; }
      var cmds = {
        up: 'cloud_backup_now', down: 'cloud_restore_download', notes: 'notes_sync'
      };
      davMsg('执行中…');
      window.__TAURI__.core.invoke(cmds[kind]).then(function (r) {
        davMsg(String(r));
        davInfo();
        if (kind === 'down' || kind === 'up') {
          return window.__TAURI__.core.invoke('page_data', { page: 'data' })
            .then(function (d) {
              window.__DATA_DATA__ = d;
              var rr = renderData(d);
              window.__DATA_RESULT__ = 'dav: ' + r + ' / ' + rr;
            });
        }
      }).catch(function (e) {
        davMsg('失败：' + e);
      });
    }
    var up = document.getElementById('btnDavUp');
    var down = document.getElementById('btnDavDown');
    var ns = document.getElementById('btnNotesSync');
    var inf = document.getElementById('btnDavInfo');
    if (up) up.addEventListener('click', function () { davAct('up'); });
    if (down) down.addEventListener('click', function () { davAct('down'); });
    if (ns) ns.addEventListener('click', function () { davAct('notes'); });
    if (inf) inf.addEventListener('click', function () { davInfo(); });
    davInfo();

    // 自测钩子（无 GUI 下点不到按钮）：?davtest=down|info|up 直接跑一次并把结果写进壳日志
    var dt = new URLSearchParams(location.search).get('davtest');
    if (dt && window.__TAURI__) {
      function nlog(m) {
        try { window.__TAURI__.core.invoke('note', { msg: 'davtest ' + m }); } catch (e) {}
      }
      var p;
      if (dt === 'down') {
        p = window.__TAURI__.core.invoke('cloud_restore_download');
      } else if (dt === 'up') {
        p = window.__TAURI__.core.invoke('cloud_backup_now');
      } else {
        p = window.__TAURI__.core.invoke('cloud_latest_info').then(function (r) {
          return JSON.stringify(r);
        });
      }
      p.then(function (r) { nlog(dt + ' ok: ' + r); davMsg(String(r)); })
       .catch(function (e) { nlog(dt + ' 失败: ' + e); davMsg('失败：' + e); });
    }
  });
  document.addEventListener('DOMContentLoaded', function () {
    if (window.__DATA_DATA__) {
      try { window.__DATA_RESULT__ = renderData(window.__DATA_DATA__); }
      catch (e) { window.__DATA_RESULT__ = 'error: ' + e.message; }
    }
  });
</script>
</body>
</html>
