<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 数据概览</title>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme.css" />
<style>
  .row { display:grid; grid-template-columns:1.05fr .95fr; gap:var(--gap); align-items:start; }
  @media (max-width:1020px){ .row{ grid-template-columns:1fr; } }
  .tb { color:#9dc0ff; }
  .ok { color:var(--green); }
  .bad { color:var(--red); }
  .act-row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<header class="page-head">
  <h1>数据管理</h1>
  <div class="sub" id="meta">加载中…</div>
  <div class="grow"></div>
  <span class="pill info" id="dbPill">只读统计</span>
</header>

<div class="kpis" id="kpis"></div>

<div class="row">
  <section class="card">
    <h2>数据表 <em id="tn"></em></h2>
    <table><thead><tr><th>表</th><th class="r">行数</th></tr></thead>
      <tbody id="tables"></tbody></table>
    <div class="note">只读统计 · 下方「立即备份 / 清理旧数据」由壳直接执行（写库，等价旧版的同名操作）</div>
    <div class="act-row">
      <button class="btn btn-primary" id="btnBackup">立即备份</button>
      <button class="btn" id="btnClean">清理旧数据</button>
      <button class="btn" id="btnJson">导出 JSON</button>
      <button class="btn" id="btnMd">导出 Markdown</button>
      <button class="btn" id="btnCsv">导出 CSV</button>
      <span class="hint" id="actMsg"></span>
    </div>
  </section>

  <section class="card">
    <h2>最近备份 <em id="bn"></em></h2>
    <table><thead><tr><th>文件</th><th class="r">大小</th><th class="r">时间</th></tr></thead>
      <tbody id="backups"></tbody></table>
  </section>
</div>

<section class="card" style="margin-top:var(--gap)">
  <h2>WebDAV 手动同步 <em id="davInfo">读取中…</em></h2>
  <div class="act-row" style="margin-top:2px">
    <button class="btn btn-primary" id="btnDavUp">上传备份到云端</button>
    <button class="btn" id="btnDavDown">下载云端最新备份</button>
    <button class="btn" id="btnNotesSync">同步便签</button>
    <button class="btn btn-ghost" id="btnDavInfo">查看云端状态</button>
  </div>

  <div id="davResult" style="margin-top:10px;padding:9px 12px;border-radius:9px;
    background:#0b1424;border:1px solid var(--border);font-size:12.5px;color:var(--dim);
    min-height:18px;font-variant-numeric:tabular-nums">
    点上面任一按钮开始；结果会显示在这里。
  </div>

  <table style="margin-top:10px;max-width:760px">
    <tbody id="davRows"></tbody>
  </table>

  <div class="note">需要先在「设置 → 网络与同步」填 WebDAV 地址 / 账号 / 密码并勾上「WebDAV 同步」；
    上传=把最新本地备份 PUT 到云端并按「云端保留份数」清理旧文件，下载=把云端最新一份落到临时目录（不覆盖当前库），
    便签同步=远端 pchabit_notes.json 与本地按 Id 合并（更新更晚的赢）后整份传回</div>
</section>

<script>
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function n(v) { return (v || 0).toLocaleString(); }

  function renderData(d) {
    if (!d || d.ok === false) {
      document.getElementById('meta').textContent = '读取失败：' + ((d && d.error) || '未知错误');
      return 'error';
    }
    document.getElementById('meta').textContent =
      d.path || '';

    var kp = document.getElementById('kpis');
    kp.innerHTML = '';
    var tables = d.tables || [];
    var totalRows = tables.reduce(function (s, t) { return s + (t.rows || 0); }, 0);
    [
      ['数据库文件', d.sizeText || '-', '主库'],
      ['WAL 日志', d.walText || '-', '未 checkpoint'],
      ['共享内存', d.shmText || '-', '-shm'],
      ['合计占用', d.totalText || '-', '库 + wal + shm'],
      ['数据表', tables.length + ' 张', '全部行数 ' + n(totalRows)],
      ['备份记录', (d.backups || []).length + ' 条', '最近 10 条'],
      ['统计耗时', (d.ms || 0).toFixed(0) + ' ms', '壳内 Rust 直读'],
    ].forEach(function (k) {
      var b = el('div', 'kpi');
      b.appendChild(el('div', 'n', k[0]));
      b.appendChild(el('div', 'v', k[1]));
      b.appendChild(el('div', 's', k[2]));
      kp.appendChild(b);
    });

    var tb = document.getElementById('tables');
    tb.innerHTML = '';
    document.getElementById('tn').textContent = tables.length + ' 张表';
    if (!tables.length) {
      var tr0 = document.createElement('tr');
      var td0 = el('td', 'empty', '没有读到数据表');
      td0.colSpan = 2; tr0.appendChild(td0); tb.appendChild(tr0);
    }
    var maxR = tables.reduce(function (m, t) { return Math.max(m, t.rows || 0); }, 1) || 1;
    tables.forEach(function (t) {
      var tr = document.createElement('tr');
      var td = el('td');
      td.appendChild(el('span', 'tb', t.table));
      td.title = n(t.rows) + ' 行';
      var bar = el('div', 'bar');
      bar.style.cssText = 'margin-top:4px;height:3px';
      var fill = el('i');
      fill.style.width = Math.max(2, ((t.rows || 0) / maxR) * 100) + '%';
      bar.appendChild(fill);
      td.appendChild(bar);
      tr.appendChild(td);
      tr.appendChild(el('td', 'r', n(t.rows)));
      tb.appendChild(tr);
    });

    var bt = document.getElementById('backups');
    bt.innerHTML = '';
    var backups = d.backups || [];
    document.getElementById('bn').textContent = backups.length + ' 条';
    if (!backups.length) {
      var tr1 = document.createElement('tr');
      var td1 = el('td', 'empty', '还没有备份记录');
      td1.colSpan = 3; tr1.appendChild(td1); bt.appendChild(tr1);
    }
    backups.forEach(function (b) {
      var tr = document.createElement('tr');
      var td = el('td');
      var name = String(b.path || '').split('\\').pop();
      td.appendChild(el('span', b.exists ? 'ok' : 'bad', name));
      td.title = (b.path || '') + (b.exists ? '' : '（文件已不存在）') +
        (b.automatic ? ' · 自动' : ' · 手动') + (b.description ? ' · ' + b.description : '');
      tr.appendChild(td);
      tr.appendChild(el('td', 'r', b.sizeText || '-'));
      tr.appendChild(el('td', 'r', String(b.createdAt || '').slice(5, 16)));
      bt.appendChild(tr);
    });

    return 'ok: ' + tables.length + ' 表 / ' + (d.sizeText || '') + ' / ' +
      backups.length + ' 备份';
  }

  window.renderData = renderData;

  // 立即备份 / 清理旧数据：由壳直接写库（VACUUM INTO / 按保留天数 DELETE）
  function act(kind) {
    var msg = document.getElementById('actMsg');
    if (!window.__TAURI__) { msg.textContent = '壳未注入 IPC，无法执行'; return; }
    msg.textContent = '执行中…';
    var call = kind === 'backup'
      ? window.__TAURI__.core.invoke('backup_db', {})
      : window.__TAURI__.core.invoke('cleanup_data', { days: 180 });
    call.then(function (r) {
      msg.textContent = String(r);
      window.__DATA_RESULT__ = 'action: ' + r;
    }).catch(function (e) {
      msg.textContent = '失败：' + e;
      window.__DATA_RESULT__ = 'action-error: ' + e;
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.getElementById('btnBackup');
    var c = document.getElementById('btnClean');
    if (b) b.addEventListener('click', function () { act('backup'); });
    if (c) c.addEventListener('click', function () { act('clean'); });

    // 多格式导出：近 30 天应用统计 → %LOCALAPPDATA%\PChabit\Exports
    function doExport(fmt, btn) {
      var msg = document.getElementById('actMsg');
      if (!window.__TAURI__) { msg.textContent = '壳未注入 IPC，无法导出'; return; }
      var label = btn.textContent;
      btn.disabled = true;
      btn.textContent = '导出中…';
      window.__TAURI__.core.invoke('export_data', { fmt: fmt, days: 30 })
        .then(function (p) {
          msg.textContent = '已导出：' + p;
          window.__DATA_RESULT__ = 'export-' + fmt + ': ' + p;
        })
        .catch(function (e) {
          msg.textContent = '导出失败：' + e;
          window.__DATA_RESULT__ = 'export-error-' + fmt + ': ' + e;
        })
        .then(function () { btn.disabled = false; btn.textContent = label; });
    }
    [['btnJson', 'json'], ['btnMd', 'md'], ['btnCsv', 'csv']].forEach(function (pair) {
      var el = document.getElementById(pair[0]);
      if (el) el.addEventListener('click', function () { doExport(pair[1], el); });
    });

    // WebDAV 手动同步：结果写在明显的结果条里，状态写进下方表格
    function stamp() {
      var d = new Date();
      function p2(x) { return (x < 10 ? '0' : '') + x; }
      return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
    }
    function davMsg(text, tone) {
      var m = document.getElementById('davResult');
      if (m) {
        m.textContent = '[' + stamp() + '] ' + text;
        m.style.color = tone === 'bad' ? 'var(--red)' : (tone === 'good' ? 'var(--green)' : 'var(--dim)');
        m.style.borderColor = tone === 'bad' ? 'var(--red)' : (tone === 'good' ? 'var(--green)' : 'var(--border)');
      }
      window.__DATA_RESULT__ = 'dav: ' + text;
    }
    function davRow(k, v) {
      var tr = document.createElement('tr');
      var td1 = el('td', null, k);
      td1.style.cssText = 'color:var(--mute);width:120px;white-space:nowrap';
      var td2 = el('td', null, v);
      td2.style.cssText = 'color:#e2e8f0;word-break:break-all';
      tr.appendChild(td1); tr.appendChild(td2);
      return tr;
    }
    function davInfo() {
      if (!window.__TAURI__) {
        davMsg('壳未注入 IPC，无法读取云端状态', 'bad');
        return;
      }
      window.__TAURI__.core.invoke('cloud_latest_info').then(function (r) {
        var el2 = document.getElementById('davInfo');
        if (el2) {
          el2.textContent = (r && r.enabled ? '已启用' : '未启用') +
            (r && r.countOk ? ' · 云端 ' + r.count + ' 份' : ' · 云端份数未知') +
            (r && r.latest ? ' · 最新 ' + r.latest : '');
        }
        var rows = document.getElementById('davRows');
        if (!rows) return;
        rows.innerHTML = '';
        rows.appendChild(davRow('开关', r && r.enabled ? 'WebDAV 同步已启用' : '未启用（去设置里勾上）'));
        rows.appendChild(davRow('地址', (r && r.url) || '（空）'));
        rows.appendChild(davRow('账号', (r && r.user) || '（空）'));
        rows.appendChild(davRow('云端备份份数', r && r.countOk ? String(r.count) : '读取失败'));
        rows.appendChild(davRow('云端最新', (r && r.latest) || '无'));
        rows.appendChild(davRow('上次同步', (r && r.lastSync) || '无'));
        if (r && r.ok === false && r.error) rows.appendChild(davRow('错误', r.error));
        if (!r || r.ok === false) {
          davMsg('云端状态读取失败：' + ((r && r.error) || '未知错误'), 'bad');
        }
      }).catch(function (e) {
        var el2 = document.getElementById('davInfo');
        if (el2) el2.textContent = '读取失败';
        davMsg('读取云端状态失败：' + e, 'bad');
      });
    }
    function davAct(kind) {
      if (!window.__TAURI__) { davMsg('壳未注入 IPC，无法执行', 'bad'); return; }
      var cmds = {
        up: 'cloud_backup_now', down: 'cloud_restore_download', notes: 'notes_sync'
      };
      var names = {
        up: '上传备份', down: '下载云端备份', notes: '同步便签'
      };
      var btn = document.getElementById(
        kind === 'up' ? 'btnDavUp' : (kind === 'down' ? 'btnDavDown' : 'btnNotesSync'));
      var old = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = names[kind] + '…'; }
      davMsg(names[kind] + '：执行中…');
      window.__TAURI__.core.invoke(cmds[kind]).then(function (r) {
        davMsg(names[kind] + ' 成功：' + r, 'good');
        davInfo();
        if (kind === 'down' || kind === 'up') {
          return window.__TAURI__.core.invoke('page_data', { page: 'data' })
            .then(function (d) {
              window.__DATA_DATA__ = d;
              renderData(d);
            });
        }
      }).catch(function (e) {
        davMsg(names[kind] + ' 失败：' + e, 'bad');
        davInfo();
      }).then(function () {
        if (btn) { btn.disabled = false; btn.textContent = old; }
      });
    }
    var up = document.getElementById('btnDavUp');
    var down = document.getElementById('btnDavDown');
    var ns = document.getElementById('btnNotesSync');
    var inf = document.getElementById('btnDavInfo');
    if (up) up.addEventListener('click', function () { davAct('up'); });
    if (down) down.addEventListener('click', function () { davAct('down'); });
    if (ns) ns.addEventListener('click', function () { davAct('notes'); });
    if (inf) inf.addEventListener('click', function () { davInfo(); });
    davInfo();

    // 自测钩子（无 GUI 下点不到按钮）：?davtest=down|info|up 直接跑一次并把结果写进壳日志
    var dt = new URLSearchParams(location.search).get('davtest');
    if (dt && window.__TAURI__) {
      function nlog(m) {
        try { window.__TAURI__.core.invoke('note', { msg: 'davtest ' + m }); } catch (e) {}
      }
      var p;
      if (dt === 'down') {
        p = window.__TAURI__.core.invoke('cloud_restore_download');
      } else if (dt === 'up') {
        p = window.__TAURI__.core.invoke('cloud_backup_now');
      } else {
        p = window.__TAURI__.core.invoke('cloud_latest_info').then(function (r) {
          return JSON.stringify(r);
        });
      }
      p.then(function (r) { nlog(dt + ' ok: ' + r); davMsg(String(r)); })
       .catch(function (e) { nlog(dt + ' 失败: ' + e); davMsg('失败：' + e); });
    }
  });
  document.addEventListener('DOMContentLoaded', function () {
    if (window.__DATA_DATA__) {
      try { window.__DATA_RESULT__ = renderData(window.__DATA_DATA__); }
      catch (e) { window.__DATA_RESULT__ = 'error: ' + e.message; }
    }
  });
</script>
</body>
</html>
