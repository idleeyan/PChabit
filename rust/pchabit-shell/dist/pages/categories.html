<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 分类管理</title>
<style>#wrap { padding: 0; }
.sub { color:var(--dim); font-size:11px; margin-bottom:12px; }
.cats { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chip { display:flex; align-items:center; gap:5px; background:var(--surface-3);
    border:1px solid var(--border); border-radius:14px; padding:3px 6px 3px 10px; font-size:11px; }
.chip.off { opacity:.45; }
.dot { width:8px; height:8px; border-radius:50%; }
.chip .x { background:none; border:0; color:var(--mute); cursor:pointer; font-size:11px;
    padding:0 3px; line-height:1; }
.chip .x:hover { color:var(--red); }
.chip .on { background:none; border:0; color:var(--green); cursor:pointer; font-size:10px; padding:0 3px; }
.newrow { display:flex; gap:6px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.newrow input[type=text] { background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:4px 8px; font-size:12px; outline:none; }
.newrow input.nm { width:130px; }
.newrow input.ic { width:44px; text-align:center; }
.newrow input[type=color] { width:30px; height:26px; background:var(--surface-3); border:1px solid var(--border);
    border-radius:5px; padding:0; cursor:pointer; }
.newrow button { background:var(--gold); border:1px solid var(--gold); color:#241a06; font-weight:600; border-radius:6px;
    padding:4px 12px; font-size:12px; cursor:pointer; }
.newrow button:hover { background:var(--gold-hi); border-color:var(--gold-hi); }
.tools { display:flex; gap:8px; margin-bottom:10px; }
.tools input { flex:1; background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:5px 9px; font-size:12px; outline:none; }
.tools input:focus { border-color:var(--gold); }
th, td { text-align:left; padding:5px 8px; border-bottom:1px solid rgba(58,48,29,.55); }
th { color:var(--dim); font-weight:500; font-size:11px; position:sticky; top:0; background:var(--bg); }
td.num { color:var(--dim); font-variant-numeric:tabular-nums; }
.proc { color:var(--mute); font-size:10px; }
.appcell { display:flex; align-items:center; gap:8px; }
.appcell .ico { width:18px; height:18px; flex:none; border-radius:3px; object-fit:contain; }
.appcell .ico.ph { display:inline-flex; align-items:center; justify-content:center;
  background:var(--surface-3); border:1px solid var(--border); color:var(--dim);
  font-size:10px; font-weight:600; line-height:1; }
.appcell .tx { min-width:0; }

  /* 分类详情弹层（旧版 CategoryDetailDialog） */
  .cmask { position:fixed; inset:0; background:rgba(0,0,0,.58); display:flex;
    align-items:center; justify-content:center; z-index:80; }
  .cbox { width:min(600px,92vw); max-height:76vh; overflow:auto; background:var(--surface);
    border:1px solid var(--border-hi); border-radius:12px; padding:15px 17px 16px;
    box-shadow:var(--shadow); }
  .cbox h3 { margin:0 0 3px; font-size:14px; letter-spacing:.04em; color:var(--gold-hi); }
  .cbox .sub2 { color:var(--mute); font-size:11px; margin-bottom:11px; }
  .cbox .x2 { position:absolute; right:14px; top:12px; }
.tag { font-size:9px; color:var(--mute); border:1px solid var(--border); border-radius:4px;
    padding:0 4px; margin-left:4px; }
select { background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:5px; padding:2px 6px; font-size:11px; outline:none; cursor:pointer; }
select:focus { border-color:var(--gold); }
tr:hover td { background:var(--surface); }
#msg { color:var(--green); font-size:11px; margin-left:8px; }</style>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<div id="wrap">
  <h1>分类管理</h1>
  <div class="sub" id="sub">近 7 天出现过的进程，改分类会直接写入程序分类映射表</div>

  <div class="cats" id="cats"></div>

  <section class="card" style="margin-top:var(--gap)">
  <div class="newrow">
    <input class="nm" id="nn" type="text" placeholder="新分类名称" maxlength="20" />
    <input class="ic" id="ni" type="text" placeholder="📁" maxlength="2" value="📁" />
    <input id="nc" type="color" value="#22C55E" title="分类颜色" />
    <button id="nadd">新建分类</button>
    <span id="msg0" style="font-size:11px;color:var(--dim)"></span>
  </div>

  <div class="tools">
    <input id="q" placeholder="搜索应用名或进程名…" />
    <span id="msg"></span>
  </div>

  <table>
    <thead>
      <tr><th style="width:40%">应用</th><th style="width:20%">近 7 天</th><th style="width:40%">分类</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  </section>
</div>
<script>
  var DATA = null;
  var ICONS = {};
  var ICONS_LOADED = false;

  function loadIcons(list) {
    if (ICONS_LOADED || !window.__TAURI__ || !list || !list.length) return;
    ICONS_LOADED = true;
    var procs = [];
    list.forEach(function (a) {
      if (a.processName && procs.indexOf(a.processName) < 0) procs.push(a.processName);
    });
    window.__TAURI__.core.invoke('app_icons', { procs: procs })
      .then(function (m) { ICONS = m || {}; if (DATA) render(DATA); })
      .catch(function () { });
  }
  var MSG = null;

  function fmtMins(v) {
    var m = Math.round(v || 0);
    if (m < 60) return m + ' 分';
    return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
  }

  /// 分类详情：该分类下的应用、时长与占比（旧版 CategoryDetailDialog 的等价实现）
  function showCategoryDetail(c, apps) {
    var list = apps.filter(function (a) { return (a.category || '') === c.name; })
      .sort(function (a, b) { return (b.minutes || 0) - (a.minutes || 0); });
    var total = list.reduce(function (s, a) { return s + (a.minutes || 0); }, 0);
    var allTotal = apps.reduce(function (s, a) { return s + (a.minutes || 0); }, 0);

    var mask = document.createElement('div');
    mask.className = 'cmask';
    var box = document.createElement('div');
    box.className = 'cbox';
    box.style.position = 'relative';

    var h = document.createElement('h3');
    h.textContent = (c.icon || '') + ' ' + c.name;
    var sub = document.createElement('div');
    sub.className = 'sub2';
    sub.textContent = list.length + ' 个应用 · 合计 ' + fmtMins(total) +
      ' · 占全部 ' + (allTotal > 0 ? (total / allTotal * 100).toFixed(1) : '0.0') + '%';
    box.appendChild(h);
    box.appendChild(sub);

    var close = document.createElement('button');
    close.className = 'btn btn-ghost x2';
    close.textContent = '关闭';
    close.addEventListener('click', function () { mask.remove(); });
    box.appendChild(close);

    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '这个分类下还没有应用（可在表格里给应用指定分类）';
      box.appendChild(empty);
    } else {
      var tb = document.createElement('table');
      var thead = document.createElement('thead');
      var trh = document.createElement('tr');
      ['应用', '进程', '时长', '占比'].forEach(function (name, i) {
        var th = document.createElement('th');
        th.textContent = name;
        if (i >= 2) th.className = 'r';
        trh.appendChild(th);
      });
      thead.appendChild(trh);
      tb.appendChild(thead);
      var tbody = document.createElement('tbody');
      list.forEach(function (a) {
        var tr = document.createElement('tr');
        var td1 = document.createElement('td');
        td1.textContent = a.appName || a.processName;
        var td2 = document.createElement('td');
        td2.className = 'proc';
        td2.textContent = a.processName;
        var td3 = document.createElement('td');
        td3.className = 'r';
        td3.textContent = fmtMins(a.minutes);
        var td4 = document.createElement('td');
        td4.className = 'r';
        td4.textContent = total > 0 ? ((a.minutes || 0) / total * 100).toFixed(1) + '%' : '—';
        [td1, td2, td3, td4].forEach(function (td) { tr.appendChild(td); });
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody);
      box.appendChild(tb);
    }

    mask.appendChild(box);
    mask.addEventListener('click', function (ev) { if (ev.target === mask) mask.remove(); });
    document.addEventListener('keydown', function esc(ev) {
      if (ev.key === 'Escape') { mask.remove(); document.removeEventListener('keydown', esc); }
    });
    document.body.appendChild(mask);
  }

  function render(d) {
    DATA = d;
    var cats = (d && d.categories) || [];
    var apps = (d && d.apps && d.apps.items) || [];

    loadIcons(apps);
    document.getElementById('sub').textContent =
      '近 ' + ((d && d.apps && d.apps.days) || 7) + ' 天 · ' + apps.length +
      ' 个进程 · ' + cats.length + ' 个启用分类';

    var chipBox = document.getElementById('cats');
    chipBox.innerHTML = '';
    cats.forEach(function (c) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (c.active ? '' : ' off');
      var dot = document.createElement('i');
      dot.className = 'dot';
      dot.style.background = c.color || '#666';
      chip.appendChild(dot);
      var cname = document.createElement('span');
      cname.textContent = (c.icon || '') + ' ' + c.name;
      cname.style.cursor = 'pointer';
      cname.title = '查看该分类下的应用明细';
      cname.addEventListener('click', function (ev) {
        ev.stopPropagation();
        showCategoryDetail(c, apps);
      });
      chip.appendChild(cname);
      if (c.active) {
        var off = document.createElement('button');
        off.className = 'x';
        off.textContent = '×';
        off.title = '停用这个分类（只置为不启用，不删数据）';
        off.addEventListener('click', function (ev) { ev.stopPropagation(); toggleActive(c, false); });
        chip.appendChild(off);
      } else {
        var on = document.createElement('button');
        on.className = 'on';
        on.textContent = '启用';
        on.title = '重新启用';
        on.addEventListener('click', function (ev) { ev.stopPropagation(); toggleActive(c, true); });
        chip.appendChild(on);
      }
      chipBox.appendChild(chip);
    });

    drawRows();
    return 'ok: ' + apps.length + ' 进程 / ' + cats.length + ' 分类';
  }

  function drawRows() {
    var cats = (DATA && DATA.categories) || [];
    var apps = (DATA && DATA.apps && DATA.apps.items) || [];
    var kw = (document.getElementById('q').value || '').trim().toLowerCase();
    // 数据层搜索回来的那批已经过滤过，本地不再重复过滤
    if (DATA && DATA.__remoteSearch && DATA.__remoteSearch.toLowerCase() === kw) kw = '';
    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    var shown = 0;

    apps.forEach(function (a) {
      if (kw && (a.appName || '').toLowerCase().indexOf(kw) < 0 &&
          (a.processName || '').toLowerCase().indexOf(kw) < 0) return;
      shown++;

      var tr = document.createElement('tr');
      var td1 = document.createElement('td');
      td1.className = 'appcell';
      var url = ICONS[a.processName];
      if (url) {
        var im = document.createElement('img');
        im.className = 'ico';
        im.src = url;
        im.alt = '';
        td1.appendChild(im);
      } else {
        var ph = document.createElement('span');
        ph.className = 'ico ph';
        ph.textContent = String(a.appName || a.processName || '?').trim().charAt(0).toUpperCase();
        td1.appendChild(ph);
      }
      var tx = document.createElement('div');
      tx.className = 'tx';
      tx.appendChild(document.createTextNode(a.appName || a.processName));
      var proc = document.createElement('div');
      proc.className = 'proc';
      proc.textContent = a.processName;
      tx.appendChild(proc);
      td1.appendChild(tx);
      if (!a.mapped) {
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = '自动推断';
        tag.title = '该进程还没有显式映射，分类来自内置规则';
        td1.appendChild(tag);
      }

      var td2 = document.createElement('td');
      td2.className = 'num';
      td2.textContent = fmtMins(a.minutes);

      var td3 = document.createElement('td');
      var sel = document.createElement('select');
      cats.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c.name;
        o.textContent = (c.icon || '') + ' ' + c.name;
        if (c.name === a.category) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () { save(a, sel.value, sel); });
      td3.appendChild(sel);

      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);
      tbody.appendChild(tr);
    });

    if (!shown) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 3;
      td.style.color = 'var(--mute)';
      td.textContent = apps.length ? '没有匹配的应用' : '暂无数据';
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
  }

  function save(app, category, sel) {
    var msg = document.getElementById('msg');
    if (!category || category === app.category) return;
    msg.textContent = '保存中…';
    sel.disabled = true;
    window.__TAURI__.core.invoke('set_category', { process: app.processName, category: category })
      .then(function (r) {
        app.category = r.category;
        app.categoryColorHex = r.categoryColorHex;
        app.mapped = true;
        msg.textContent = '已保存：' + app.processName + ' → ' + r.category +
          (r.created ? '（新增）' : '（更新）');
        sel.disabled = false;
        // 写库后其余页面的分类口径也变了，重算全部载荷
        return window.__TAURI__.core.invoke('pages_data').then(function (p) {
          window.__PAGES__ = p;
          window.__PAGES__.admin = DATA;
          window.__ADMIN_SAVED__ = app.processName + ':' + r.category;
        });
      })
      .then(function () { window.__ADMIN_RESULT__ = 'saved ' + app.processName; })
      .catch(function (e) {
        msg.textContent = '保存失败：' + e;
        sel.disabled = false;
        window.__ADMIN_RESULT__ = 'error: ' + e;
      });
  }

  function toggleActive(cat, active) {
    var msg = document.getElementById('msg0');
    msg.textContent = (active ? '启用中…' : '停用中…');
    window.__TAURI__.core.invoke('set_category_active', { id: cat.id, active: active })
      .then(function (r) {
        msg.textContent = '已' + (active ? '启用' : '停用') + '：' + r.name;
        reloadAdmin();
      })
      .catch(function (e) { msg.textContent = '失败：' + e; });
  }

  function createCat() {
    var msg = document.getElementById('msg0');
    var name = (document.getElementById('nn').value || '').trim();
    var icon = (document.getElementById('ni').value || '').trim() || '📁';
    var color = document.getElementById('nc').value || '#22C55E';
    if (!name) { msg.textContent = '请先填名称'; return; }
    msg.textContent = '创建中…';
    window.__TAURI__.core.invoke('create_category', { name: name, color: color, icon: icon })
      .then(function (r) {
        msg.textContent = '已新建：「' + r.name + '」';
        document.getElementById('nn').value = '';
        reloadAdmin();
      })
      .catch(function (e) { msg.textContent = '失败：' + e; });
  }

  // 写完重新取一份分类管理数据（含进程列表），并让父页面也刷新其余页载荷
  function reloadAdmin() {
    return window.__TAURI__.core.invoke('page_data', { page: 'admin' }).then(function (d) {
      window.__ADMIN_RESULT__ = render(d);
      if (window.__PAGES__) window.__PAGES__.admin = d;
      return window.__TAURI__.core.invoke('pages_data').then(function (p) {
        window.__PAGES__ = p;
        window.__PAGES__.admin = d;
      });
    }).then(function () {
      window.__ADMIN_RESULT__ = 'ok: ' + ((DATA.apps && DATA.apps.items) || []).length + ' 进程 / ' +
        ((DATA.categories || []).filter(function (c) { return c.active; }).length) + ' 分类';
    }).catch(function (e) { document.getElementById('msg0').textContent = '刷新失败：' + e; });
  }

  document.getElementById('nadd').addEventListener('click', createCat);
  // 进程表很大时把过滤下沉到数据层（datad 的 search），小表仍走本地过滤
  var searchTimer = null;
  document.getElementById('q').addEventListener('input', function () {
    var apps = (DATA && DATA.apps && DATA.apps.items) || [];
    var kw = (this.value || '').trim();
    if (apps.length <= 300 || !window.__TAURI__) { drawRows(); return; }
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      window.__TAURI__.core.invoke('app_search', { q: kw })
        .then(function (r) {
          DATA.apps = DATA.apps || {};
          DATA.apps.items = r.items || [];
          DATA.__remoteSearch = kw; // 标记：这批是数据层过滤结果，drawRows 不再二次过滤
          drawRows();
          window.__ADMIN_RESULT__ = 'search: ' + (r.count || 0) + ' / ' + kw;
        })
        .catch(function (e) {
          DATA.__remoteSearch = '';
          drawRows();
          window.__ADMIN_RESULT__ = 'search-error: ' + e;
        });
    }, 220);
  });

  document.addEventListener('DOMContentLoaded', function () {
    if (window.__ADMIN_DATA__) {
      try { window.__ADMIN_RESULT__ = render(window.__ADMIN_DATA__); }
      catch (e) { window.__ADMIN_RESULT__ = 'error: ' + e.message; }
    }
  });

  window.renderAdmin = function (d) {
    window.__ADMIN_DATA__ = d;
    return render(d);
  };
</script>
</body>
</html>
