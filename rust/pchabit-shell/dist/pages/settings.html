<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 设置概览</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; background:#0f172a; color:#e2e8f0;
    font:12px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
  #wrap { padding:14px 16px 24px; }
  h1 { font-size:15px; font-weight:600; margin:0 0 2px; }
  .sub { color:#94a3b8; font-size:11px; margin-bottom:12px; word-break:break-all; }
  .hint { background:#16233a; border-left:3px solid #3b82f6; border-radius:8px;
    padding:8px 10px; color:#94a3b8; font-size:11px; margin-bottom:14px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  section { background:#121a29; border:1px solid #223049; border-radius:10px; padding:10px 12px; }
  section h2 { font-size:12px; font-weight:600; margin:0 0 8px; color:#cbd5e1; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0;
    border-bottom:1px solid #1b2436; }
  .row:last-child { border-bottom:0; }
  .k { color:#94a3b8; font-size:11px; }
  .v { font-size:11px; text-align:right; word-break:break-all; }
  .on { color:#34d399; } .off { color:#64748b; }
  .mask { color:#f59e0b; }
  .unset { color:#475569; }
</style>
</head>
<body>
<div id="wrap">
  <h1>设置概览</h1>
  <div class="sub" id="path"></div>
  <div class="hint">下方概览只读；顶部「可编辑项」直接写回 settings.json（写前自动备份 .bak），与 WPF 版共用同一个文件。</div>
  <section id="edit" style="margin-bottom:12px">
    <h2>可编辑项 <em style="font-style:normal;color:#64748b;font-size:10px">（写回 settings.json，改前自动备份 .bak）</em></h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <label class="k">保留天数 <input id="edRetention" type="number" min="1" max="3650"
        style="width:70px;margin-left:4px;background:#0f172a;color:#e2e8f0;border:1px solid #223049;border-radius:5px;padding:2px 6px"></label>
      <label class="k">采集间隔(秒) <input id="edInterval" type="number" min="1" max="60"
        style="width:60px;margin-left:4px;background:#0f172a;color:#e2e8f0;border:1px solid #223049;border-radius:5px;padding:2px 6px"></label>
      <label class="k">空闲阈值(分) <input id="edIdle" type="number" min="1" max="60"
        style="width:60px;margin-left:4px;background:#0f172a;color:#e2e8f0;border:1px solid #223049;border-radius:5px;padding:2px 6px"></label>
      <label class="k"><input id="edTaskbar" type="checkbox" style="margin-right:4px">任务栏小窗</label>
      <button id="edSave" style="padding:4px 12px;border-radius:6px;border:1px solid #223049;
        background:#1d4ed8;color:#fff;cursor:pointer">保存</button>
      <span class="hint" id="edMsg" style="margin:0;background:none;border:0;padding:0"></span>
    </div>
  </section>
  <div class="grid" id="grid"></div>
</div>
<script>
  // 分组靠固定表，未知键归到"其他"
  var GROUPS = [
    ['通用', ['StartWithWindows','MinimizeToTray','ShowNotifications','AutoStartMonitoring','CurrentTheme','CurrentLanguage','DailyUsageGoalHours']],
    ['采集', ['MonitoringInterval','IdleThreshold','TrackKeyboard','TrackMouse','TrackWebBrowsing','AnonymizeData','RetentionDays','DataRetentionDays','AutoCleanupEnabled','ArchiveBeforeCleanup']],
    ['网络与同步', ['WebSocketPort','WebDAVEnabled','WebDAVUrl','WebDAVUsername','WebDAVLastSync','BrowserSyncEnabled','BrowserHistoryIngestEnabled','BrowserSyncIntervalMinutes','BrowserAutoPush']],
    ['备份', ['BackupPath','AutoBackupEnabled','AutoBackupIntervalHours','MaxBackupCount','MaxCloudBackupCount']],
    ['任务栏', ['TaskbarEnabled','TaskbarShowCpu','TaskbarShowMemory','TaskbarShowGpu','TaskbarShowNet','TaskbarShowDisk','TaskbarShowTemp','TaskbarShowUsage']],
    ['桌面组件', ['DesktopWidgetEnabled','DesktopWidgetTopmost','DesktopWidgetClickThrough','DesktopWidgetScreen','DesktopWidgetWidth','DesktopWidgetHeight']],
    ['AI', ['AiInsightsEnabled','AiEndpointMode','AiModel','AiLocalModel','AiCloudModel','AiTimeoutSeconds','AiStrictPrivacy','AiAutoWeeklyInsight']],
    ['便签', ['StickyNotesEnabled','StickyNotesHotkeyNew','StickyNotesHotkeyBoard','StickyNotesSyncEnabled','StickyNotesRetentionDays']]
  ];

  function fmt(it) {
    if (it.kind === 'secret') {
      var e = document.createElement('span');
      e.className = it.set ? 'mask' : 'unset';
      e.textContent = it.set ? '已设置（不回显）' : '未设置';
      return e;
    }
    if (it.kind === 'bool') {
      var b = document.createElement('span');
      b.className = it.value ? 'on' : 'off';
      b.textContent = it.value ? '开' : '关';
      return b;
    }
    var s = document.createElement('span');
    s.textContent = (it.value === null || it.value === undefined) ? '—' : String(it.value);
    if (s.textContent === '' || s.textContent === '—') s.className = 'unset';
    return s;
  }

  function render(d) {
    if (!d) return 'error: no data';
    document.getElementById('path').textContent =
      d.path + '　' + (d.count || 0) + ' 项' + (d.error ? '　读取失败：' + d.error : '') +
      '　敏感打码 ' + (d.maskedCount || 0) + ' 项';
    if (d.error) return 'error: ' + d.error;

    var byKey = {};
    (d.items || []).forEach(function (i) { byKey[i.key] = i; });

    // 把当前值填进可编辑区（只在第一次或数据变化时覆盖，免得抹掉用户正在输的内容）
    var ed = document.getElementById('edit');
    if (ed && !ed.__painted) {
      function num(k) { return byKey[k] && byKey[k].value != null ? byKey[k].value : ''; }
      document.getElementById('edRetention').value = num('DataRetentionDays') || num('RetentionDays');
      document.getElementById('edInterval').value = num('MonitoringInterval');
      document.getElementById('edIdle').value = num('IdleThreshold');
      document.getElementById('edTaskbar').checked = !!(byKey['TaskbarEnabled'] && byKey['TaskbarEnabled'].value);
      ed.__painted = true;
    }

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var used = {};

    GROUPS.forEach(function (g) {
      var known = g[1].filter(function (k) { return byKey[k]; });
      if (!known.length) return;
      known.forEach(function (k) { used[k] = true; });
      grid.appendChild(section(g[0], known.map(function (k) { return byKey[k]; })));
    });

    var others = (d.items || []).filter(function (i) { return !used[i.key]; });
    if (others.length) grid.appendChild(section('其他', others));

    return 'ok: ' + (d.count || 0) + ' 项 / ' + grid.children.length + ' 组';
  }

  function section(title, items) {
    var s = document.createElement('section');
    var h = document.createElement('h2');
    h.textContent = title;
    s.appendChild(h);
    items.forEach(function (it) {
      var row = document.createElement('div');
      row.className = 'row';
      var k = document.createElement('span');
      k.className = 'k';
      k.textContent = it.key;
      var v = document.createElement('span');
      v.className = 'v';
      v.appendChild(fmt(it));
      row.appendChild(k);
      row.appendChild(v);
      s.appendChild(row);
    });
    return s;
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.__SET_DATA__) {
      try { window.__SET_RESULT__ = render(window.__SET_DATA__); }
      catch (e) { window.__SET_RESULT__ = 'error: ' + e.message; }
    }
    var save = document.getElementById('edSave');
    if (save) save.addEventListener('click', function () {
      var msg = document.getElementById('edMsg');
      if (!window.__TAURI__) { msg.textContent = '壳未注入 IPC'; return; }
      var jobs = [
        ['DataRetentionDays', parseInt(document.getElementById('edRetention').value, 10)],
        ['MonitoringInterval', parseInt(document.getElementById('edInterval').value, 10)],
        ['IdleThreshold', parseInt(document.getElementById('edIdle').value, 10)],
        ['TaskbarEnabled', document.getElementById('edTaskbar').checked]
      ];
      msg.textContent = '保存中…';
      var chain = Promise.resolve([]);
      jobs.forEach(function (j) {
        if (typeof j[1] === 'number' && isNaN(j[1])) return;
        chain = chain.then(function (done) {
          return window.__TAURI__.core.invoke('set_setting', { key: j[0], value: j[1] })
            .then(function (r) { done.push(r); return done; });
        });
      });
      chain.then(function (done) {
        msg.textContent = done.join('；');
        window.__SET_RESULT__ = 'save: ' + done.join('；');
      }).catch(function (e) {
        msg.textContent = '失败：' + e;
        window.__SET_RESULT__ = 'save-error: ' + e;
      });
    });
  });

  window.renderSettings = function (d) {
    window.__SET_DATA__ = d;
    return render(d);
  };
</script>
</body>
</html>
