<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 设置</title>
<style>#wrap { padding: 0; }
.sub { color:var(--dim); font-size:11px; margin-bottom:10px; word-break:break-all; }
.hint { background:var(--surface-3); border-left:3px solid var(--gold); border-radius:8px;
    padding:8px 10px; color:var(--dim); font-size:11px; margin-bottom:14px; line-height:1.7; }
.hint b { color:var(--text); font-weight:600; }
.grid { column-width:380px; column-gap:12px; }
.row { display:grid; grid-template-columns: 1fr auto; gap:8px; align-items:center;
    padding:5px 0; border-bottom:1px solid rgba(58,48,29,.55); }
.row:last-child { border-bottom:0; }
.k { color:var(--dim); font-size:11px; min-width:0; }
.k .name { color:var(--text); }
.k .raw { display:block; color:var(--mute); font-size:10px; }
.ctl { justify-self:end; display:flex; align-items:center; gap:6px; }
.st { color:var(--mute); font-size:10px; min-height:14px; text-align:right; grid-column:1 / -1; margin:-2px 0 2px; }
.st.ok { color:var(--green); }
.st.err { color:var(--red); }
input[type=checkbox] { width:15px; height:15px; accent-color:var(--gold); cursor:pointer; }
input[type=number], input[type=text], input[type=password] {
    background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px;
    padding:3px 7px; font:12px/1.4 "Segoe UI","Microsoft YaHei",sans-serif; }
input[type=number] { width:78px; }
input[type=text] { width:172px; }
input[type=password] { width:112px; }
input:focus { outline:none; border-color:var(--gold); }
.ro { color:var(--dim); font-size:11px; max-width:150px; word-break:break-all; text-align:right;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag { font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--border); color:var(--mute); }
.tag.live { color:var(--green); border-color:#1e4634; background:#0f2a22; }
.tag.restart { color:var(--amber); border-color:#4a3a1c; background:#261f10; }
.tag.idle { color:var(--dim); border-color:#2b374b; background:#1a2334; }
.badge { font-size:10px; padding:1px 6px; border-radius:4px; }
.badge.set { background:#0f2a22; color:var(--green); border:1px solid #1e4634; }
.badge.unset { background:#1a2334; color:var(--mute); border:1px solid var(--border); }
.smallbtn { background:var(--surface-3); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:2px 9px; font-size:11px; cursor:pointer; }
.smallbtn:hover { background:#20304a; border-color:var(--gold); color:#fff; }
.bar { display:flex; gap:8px; align-items:center; margin:0 0 12px; }</style>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<div id="wrap">
  <h1>设置</h1>
  <div class="sub" id="path"></div>
  <div class="hint">
    <b>改完立即写回</b> <code>settings.json</code>（写前自动备份 <code>.bak</code>）。
    标 <span class="tag live">立即生效</span> 的项改这一秒就起作用；
    标 <span class="tag restart">重启生效</span> 的项要重启壳（托盘右键「退出」后再打开）才读新值。
    密码类只显示「已设置」，留空表示不改。
  </div>
  <div class="bar">
    <button class="smallbtn" id="cloudNow">立即云备份</button>
    <button class="smallbtn" id="cloudInfo">查看云端状态</button>
    <button class="smallbtn" id="notesSync">同步便签</button>
    <span id="cloudMsg" class="sub"></span>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
  // 键 → 中文名（没有映射的就显示原始键名，仍然可改）
  var NAME = {
    StartWithWindows: '开机自启',
    MinimizeToTray: '关闭窗口时最小化到托盘',
    ShowNotifications: '显示通知',
    AutoStartMonitoring: '启动即开始采集',
    CollectInShell: '采集宿主随壳启动',
    CurrentTheme: '主题',
    ThemePreset: '配色方案',
    ThemeAccent: '强调色',
    CurrentLanguage: '语言',
    DailyUsageGoalHours: '每日使用目标（小时）',
    MonitoringInterval: '采集间隔（秒）',
    IdleThreshold: '空闲阈值（分）',
    TrackKeyboard: '记录键盘',
    TrackMouse: '记录鼠标',
    TrackWebBrowsing: '记录网页访问',
    AnonymizeData: '数据匿名化',
    RetentionDays: '保留天数（旧键）',
    DataRetentionDays: '数据保留天数',
    AutoCleanupEnabled: '自动清理旧数据',
    ArchiveBeforeCleanup: '清理前归档',
    WebSocketPort: '扩展通道端口',
    WebDAVEnabled: 'WebDAV 同步',
    WebDAVUrl: 'WebDAV 地址',
    WebDAVUsername: 'WebDAV 用户名',
    WebDAVPassword: 'WebDAV 密码',
    WebDAVLastSync: '上次 WebDAV 同步',
    BrowserSyncEnabled: '浏览器同步',
    BrowserHistoryIngestEnabled: '读取浏览器历史',
    BrowserSyncIntervalMinutes: '浏览器同步间隔（分）',
    BrowserAutoPush: '浏览器自动推送',
    BackupPath: '备份目录',
    AutoBackupEnabled: '自动备份',
    AutoBackupIntervalHours: '备份间隔（小时）',
    MaxBackupCount: '本地备份份数上限',
    MaxCloudBackupCount: '云端备份份数上限',
    TaskbarEnabled: '任务栏小窗',
    TaskbarShowCpu: '小窗显示 CPU',
    TaskbarShowMemory: '小窗显示内存',
    TaskbarShowGpu: '小窗显示 GPU',
    TaskbarShowVram: '小窗显示显存',
    TaskbarShowNet: '小窗显示网速',
    TaskbarShowDisk: '小窗显示磁盘',
    TaskbarShowTemp: '小窗显示温度',
    TaskbarShowUsage: '小窗显示用量',
    DesktopWidgetEnabled: '桌面悬浮窗',
    DesktopWidgetShowCpu: '悬浮窗显示 CPU',
    DesktopWidgetShowMemory: '悬浮窗显示内存',
    DesktopWidgetShowGpu: '悬浮窗显示 GPU',
    DesktopWidgetShowVram: '悬浮窗显示显存',
    DesktopWidgetShowNet: '悬浮窗显示网速',
    DesktopWidgetShowDisk: '悬浮窗显示磁盘',
    DesktopWidgetShowUsage: '悬浮窗显示用量',
    DesktopWidgetShowCurrentApp: '悬浮窗显示当前应用',
    DesktopWidgetTopmost: '悬浮窗置顶',
    DesktopWidgetClickThrough: '悬浮窗点击穿透',
    DesktopWidgetClampToScreen: '悬浮窗限制在屏幕内',
    DesktopWidgetScreen: '悬浮窗所在显示器',
    DesktopWidgetLeft: '悬浮窗 X',
    DesktopWidgetTop: '悬浮窗 Y',
    DesktopWidgetWidth: '悬浮窗宽',
    DesktopWidgetHeight: '悬浮窗高',
    StickyNotesEnabled: '桌面便签',
    StickyNotesHotkeyNew: '新建便签快捷键',
    StickyNotesHotkeyBoard: '便签板快捷键',
    StickyNotesSyncEnabled: '便签同步',
    StickyNotesLastSync: '上次便签同步',
    StickyNotesRetentionDays: '便签保留天数',
    StickyNotesQuickDismissOnFocusLost: '失焦自动收起便签',
    StickyNotesDeviceId: '便签设备标识'
  };

  // 改了当拍就生效的键（其余标「重启生效」或「未接入」）
  var LIVE = {
    ThemePreset: 1, ThemeAccent: 1, BrowserSyncEnabled: 1,
    TaskbarEnabled: 1, TaskbarShowCpu: 1, TaskbarShowMemory: 1, TaskbarShowNet: 1,
    TaskbarShowGpu: 1, TaskbarShowVram: 1, TaskbarShowDisk: 1, TaskbarShowUsage: 1,
    DataRetentionDays: 1, RetentionDays: 1,
    AutoCleanupEnabled: 1, ArchiveBeforeCleanup: 1,
    // 采集侧每秒/每分钟重读 settings.json，改了立刻生效
    TrackKeyboard: 1, TrackMouse: 1, TrackWebBrowsing: 1, BrowserHistoryIngestEnabled: 1,
    AnonymizeData: 1,
    // 壳侧：关窗行为、开机自启、采集宿主计划任务都即时改
    MinimizeToTray: 1, StartWithWindows: 1, AutoStartMonitoring: 1,
    // 采集宿主计划任务都即时改
    ShowNotifications: 1, DailyUsageGoalHours: 1,
    // 备份线程每 5 分钟读一次设置
    AutoBackupEnabled: 1, AutoBackupIntervalHours: 1, MaxBackupCount: 1, BackupPath: 1,
    WebDAVEnabled: 1, WebDAVUrl: 1, WebDAVUsername: 1, WebDAVPassword: 1, MaxCloudBackupCount: 1,
    // 桌面小窗每拍重读（GPU/显存/磁盘/占用/当前应用、多屏定位都在这一拍里用）
    DesktopWidgetShowCpu: 1, DesktopWidgetShowMemory: 1, DesktopWidgetShowNet: 1,
    DesktopWidgetShowGpu: 1, DesktopWidgetShowVram: 1, DesktopWidgetShowDisk: 1,
    DesktopWidgetShowUsage: 1, DesktopWidgetShowCurrentApp: 1,
    DesktopWidgetClampToScreen: 1, DesktopWidgetScreen: 1,
    StickyNotesQuickDismissOnFocusLost: 1,
    StickyNotesSyncEnabled: 1, StickyNotesLastSync: 1
  };

  // 配色方案：与 tokens.css 的 data-theme / data-accent 取值一一对应
  var ENUM = {
    ThemePreset: [
      ['gold', '鎏金暗夜'], ['graphite', '石墨灰蓝'],
      ['warm', '暖棕纸墨'], ['slate', '青灰极简']
    ],
    ThemeAccent: [
      ['auto', '跟随方案'], ['gold', '金'], ['copper', '铜'], ['blue', '蓝'], ['cyan', '青'],
      ['violet', '紫'], ['green', '绿'], ['amber', '琥珀'], ['rose', '玫']
    ]
  };
  // 当前选择，改完通过 postMessage 通知导航壳即时切换
  var THEME_SEL = { theme: 'gold', accent: 'auto' };

  // 已决定不做的项：温度受 HVCI 限制（4.11.1 删除）、CollectInShell 是旧架构
  var DEPRECATED = {
    TaskbarShowTemp: 1, CollectInShell: 1, StickyNotesRetentionDays: 1, CurrentTheme: 1,
    // 以下五项在旧版 C# 里同样只有设置项、没有使用点；不接成可配，避免继续误导
    CurrentLanguage: 1, MonitoringInterval: 1, IdleThreshold: 1,
    BrowserSyncIntervalMinutes: 1, BrowserAutoPush: 1
  };

  // Rust 侧还没接线的键：能改、会写进 settings.json，但当前壳/采集不读它（旧 WPF 功能尚未迁移）
  var INACTIVE = {
    // 目前没有「已实现但未接线」的开关；保留机制供后续新增项使用
  };

  // 废弃项各自的说明（不写就用默认文案）
  var DEPRECATED_TXT = {
    StickyNotesRetentionDays: '已废弃（便签永久保存）',
    CurrentTheme: '已废弃（界面固定深色）',
    CurrentLanguage: '已废弃（界面仅中文）',
    MonitoringInterval: '已废弃（固定 1 秒采样）',
    IdleThreshold: '已废弃（未接入空闲判定）',
    BrowserSyncIntervalMinutes: '已废弃（改由扩展推送）',
    BrowserAutoPush: '已废弃（旧书签同步已下线）'
  };

  var GROUPS = [
    ['通用', ['StartWithWindows','MinimizeToTray','ShowNotifications','AutoStartMonitoring','CollectInShell','ThemePreset','ThemeAccent','CurrentLanguage','DailyUsageGoalHours']],
    ['采集', ['TrackKeyboard','TrackMouse','TrackWebBrowsing','AnonymizeData','DataRetentionDays','RetentionDays','AutoCleanupEnabled','ArchiveBeforeCleanup','MonitoringInterval','IdleThreshold']],
    ['网络与同步', ['WebSocketPort','WebDAVEnabled','WebDAVUrl','WebDAVUsername','WebDAVPassword','WebDAVLastSync','BrowserSyncEnabled','BrowserHistoryIngestEnabled','BrowserSyncIntervalMinutes','BrowserAutoPush']],
    ['备份', ['BackupPath','AutoBackupEnabled','AutoBackupIntervalHours','MaxBackupCount','MaxCloudBackupCount']],
    ['任务栏小窗', ['TaskbarEnabled','TaskbarShowNet','TaskbarShowCpu','TaskbarShowMemory','TaskbarShowGpu','TaskbarShowVram','TaskbarShowDisk','TaskbarShowTemp','TaskbarShowUsage']],
    ['桌面悬浮窗', ['DesktopWidgetEnabled','DesktopWidgetShowCpu','DesktopWidgetShowMemory','DesktopWidgetShowGpu','DesktopWidgetShowVram','DesktopWidgetShowNet','DesktopWidgetShowDisk','DesktopWidgetShowUsage','DesktopWidgetShowCurrentApp','DesktopWidgetTopmost','DesktopWidgetClickThrough','DesktopWidgetClampToScreen','DesktopWidgetScreen','DesktopWidgetLeft','DesktopWidgetTop','DesktopWidgetWidth','DesktopWidgetHeight']],
    ['便签', ['StickyNotesEnabled','StickyNotesHotkeyNew','StickyNotesHotkeyBoard','StickyNotesSyncEnabled','StickyNotesLastSync','StickyNotesRetentionDays','StickyNotesQuickDismissOnFocusLost','StickyNotesDeviceId']]
  ];

  var editing = false;   // 用户正在输入时，别被 60 秒自动刷新打断

  function now() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
  }

  function setStatus(el, text, cls) {
    if (!el) return;
    el.textContent = text;
    el.className = 'st' + (cls ? ' ' + cls : '');
  }

  function save(it, value, st) {
    setStatus(st, '保存中…');
    window.__TAURI__.core.invoke('set_setting', { key: it.key, value: value })
      .then(function () {
        setStatus(st, '已保存 ' + now(), 'ok');
        it.value = value;
        if (window.__TAURI__) window.__SET_RESULT__ = 'save: ' + it.key + ' = ' + value;
        if (it.key === 'ThemePreset' || it.key === 'ThemeAccent') {
          THEME_SEL[it.key === 'ThemePreset' ? 'theme' : 'accent'] = String(value);
          try {
            window.parent.postMessage(
              { type: 'pch-theme', theme: THEME_SEL.theme, accent: THEME_SEL.accent }, '*');
          } catch (e) { }
        }
      })
      .catch(function (e) { setStatus(st, '失败：' + e, 'err'); });
  }

  function row(it, grid) {
    var r = document.createElement('div');
    r.className = 'row';

    var k = document.createElement('div');
    k.className = 'k';
    var nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = (NAME[it.key] || it.key) + (LIVE[it.key] ? '' : '');
    k.appendChild(nm);
    if (NAME[it.key]) {
      var raw = document.createElement('span');
      raw.className = 'raw';
      raw.textContent = it.key;
      k.appendChild(raw);
    }
    if (it.readOnly) {
      // 只读项下面不挂生效标签
    } else if (LIVE[it.key]) {
      var tag2 = document.createElement('span');
      tag2.className = 'tag live';
      tag2.textContent = '立即生效';
      k.appendChild(tag2);
    } else if (DEPRECATED[it.key]) {
      var tag4 = document.createElement('span');
      tag4.className = 'tag idle';
      tag4.textContent = DEPRECATED_TXT[it.key] || '已废弃（不再生效）';
      k.appendChild(tag4);
    } else if (INACTIVE[it.key]) {
      var tag3 = document.createElement('span');
      tag3.className = 'tag idle';
      tag3.textContent = 'Rust 未接入';
      k.appendChild(tag3);
    } else {
      var tag = document.createElement('span');
      tag.className = 'tag restart';
      tag.textContent = '重启生效';
      k.appendChild(tag);
    }

    var ctl = document.createElement('div');
    ctl.className = 'ctl';
    var st = document.createElement('div');
    st.className = 'st';

    if (it.readOnly) {
      var ro = document.createElement('span');
      ro.className = 'ro';
      ro.textContent = (it.type === 'secret') ? (it.set ? '已设置' : '未设置')
        : (it.value === null || it.value === undefined ? '—' : String(it.value));
      ro.title = ro.textContent;
      ctl.appendChild(ro);
      var tagRo = document.createElement('span');
      tagRo.className = 'tag';
      tagRo.textContent = '只读';
      ctl.appendChild(tagRo);
    } else if (it.type === 'bool') {
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!it.value;
      cb.addEventListener('change', function () { save(it, cb.checked, st); });
      ctl.appendChild(cb);
    } else if (it.type === 'int' || it.type === 'float') {
      var num = document.createElement('input');
      num.type = 'number';
      num.step = (it.type === 'float') ? '0.1' : '1';
      num.value = it.value;
      function commitNum() {
        var v = Number(num.value);
        if (!isFinite(v)) { setStatus(st, '不是数字', 'err'); return; }
        save(it, (it.type === 'int') ? Math.round(v) : v, st);
      }
      num.addEventListener('change', commitNum);
      num.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitNum(); });
      num.addEventListener('focus', function () { editing = true; });
      num.addEventListener('blur', function () { editing = false; });
      ctl.appendChild(num);
    } else if (it.type === 'secret') {
      var badge = document.createElement('span');
      badge.className = 'badge ' + (it.set ? 'set' : 'unset');
      badge.textContent = it.set ? '已设置' : '未设置';
      var pw = document.createElement('input');
      pw.type = 'password';
      pw.placeholder = it.set ? '输入新值才改' : '输入新值';
      var btn = document.createElement('button');
      btn.className = 'smallbtn';
      btn.textContent = '保存';
      btn.addEventListener('click', function () {
        if (!pw.value) { setStatus(st, '没填新值，未改动', 'err'); return; }
        save(it, pw.value, st);
        pw.value = '';
        badge.className = 'badge set';
        badge.textContent = '已设置';
      });
      pw.addEventListener('focus', function () { editing = true; });
      pw.addEventListener('blur', function () { editing = false; });
      ctl.appendChild(badge); ctl.appendChild(pw); ctl.appendChild(btn);
    } else if (ENUM[it.key]) {
      if (it.key === 'ThemePreset') THEME_SEL.theme = String(it.value);
      if (it.key === 'ThemeAccent') THEME_SEL.accent = String(it.value);
      var sel = document.createElement('select');
      ENUM[it.key].forEach(function (pair) {
        var op = document.createElement('option');
        op.value = pair[0];
        op.textContent = pair[1];
        if (String(it.value) === pair[0]) op.selected = true;
        sel.appendChild(op);
      });
      sel.addEventListener('change', function () { save(it, sel.value, st); });
      ctl.appendChild(sel);
    } else {
      var tx = document.createElement('input');
      tx.type = 'text';
      tx.value = (it.value === null || it.value === undefined) ? '' : String(it.value);
      tx.title = tx.value;
      function commitText() { save(it, tx.value, st); }
      tx.addEventListener('change', commitText);
      tx.addEventListener('keydown', function (e) { if (e.key === 'Enter') { commitText(); tx.blur(); } });
      tx.addEventListener('focus', function () { editing = true; });
      tx.addEventListener('blur', function () { editing = false; });
      ctl.appendChild(tx);
    }

    r.appendChild(k);
    r.appendChild(ctl);
    r.appendChild(st);
    grid.appendChild(r);
  }

  function section(title, items, grid) {
    var s = document.createElement('section');
    var h = document.createElement('h2');
    h.textContent = title;
    var n = document.createElement('em');
    n.textContent = items.length + ' 项';
    h.appendChild(n);
    s.appendChild(h);
    items.forEach(function (it) { row(it, s); });
    grid.appendChild(s);
  }

  /// 关于：版本 / 技术栈 / 目录 / 项目地址（只读展示，便于排查时一眼取到路径）
  function aboutSection(grid, d) {
    var s = document.createElement('section');
    var h = document.createElement('h2');
    h.textContent = '关于';
    var em = document.createElement('em');
    em.textContent = 'PChabit';
    h.appendChild(em);
    s.appendChild(h);

    var dir = String(d.path || '').replace(/[\\/][^\\/]+$/, '');
    var rows = [
      ['版本', window.__VER__ || '—'],
      ['技术栈', 'Rust + Tauri 2 + WebView2'],
      ['数据目录', dir],
      ['数据库', dir + '\\Data\\pchabit.db'],
      ['日志', '%TEMP%\\pchabit-shell.log'],
      ['项目地址', 'https://github.com/idleeyan/PChabit']
    ];
    rows.forEach(function (pair) {
      var r = document.createElement('div');
      r.className = 'row';
      var k = document.createElement('div');
      k.className = 'k';
      var nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = pair[0];
      k.appendChild(nm);
      var ctl = document.createElement('div');
      ctl.className = 'ctl';
      var ro = document.createElement('span');
      ro.className = 'ro';
      ro.textContent = pair[1] || '—';
      ro.title = pair[1] || '';
      ctl.appendChild(ro);
      r.appendChild(k);
      r.appendChild(ctl);
      var st = document.createElement('div');
      st.className = 'st';
      r.appendChild(st);
      s.appendChild(r);
    });
    grid.appendChild(s);
  }

  function render(d) {
    if (!d) return 'error: no data';
    var pathEl = document.getElementById('path');
    pathEl.textContent = d.path + '　' + (d.count || 0) + ' 项' +
      (d.maskedCount ? '（' + d.maskedCount + ' 项敏感已打码）' : '') +
      (d.error ? '　读取失败：' + d.error : '');
    if (d.error) return 'error: ' + d.error;
    if (editing) return 'skip: 正在编辑';

    var items = (d.items || []).filter(function (i) { return i.kind !== 'text'; });
    var byKey = {};
    items.forEach(function (i) { byKey[i.key] = i; });

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var used = {};

    GROUPS.forEach(function (g) {
      var known = g[1].filter(function (k) { return byKey[k]; });
      if (!known.length) return;
      known.forEach(function (k) { used[k] = true; });
      section(g[0], known.map(function (k) { return byKey[k]; }), grid);
    });

    var others = items.filter(function (i) { return !used[i.key]; });
    if (others.length) section('其他', others, grid);
    aboutSection(grid, d);

    return 'ok: ' + items.length + ' 项 / ' + grid.children.length + ' 组';
  }

  window.renderSettings = function (d) {
    window.__SET_DATA__ = d;
    try { return render(d); }
    catch (e) { return 'error: ' + e.message; }
  };

  document.addEventListener('DOMContentLoaded', function () {
    if (window.__SET_DATA__) {
      try { window.__SET_RESULT__ = render(window.__SET_DATA__); }
      catch (e) { window.__SET_RESULT__ = 'error: ' + e.message; }
    }
    var msg = document.getElementById('cloudMsg');
    var inv = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    document.getElementById('cloudNow').onclick = function () {
      if (!inv) { msg.textContent = 'IPC 不可用'; return; }
      msg.textContent = '正在上传…';
      inv('cloud_backup_now').then(function (r) { msg.textContent = r; })
        .catch(function (e) { msg.textContent = '失败：' + e; });
    };
    document.getElementById('cloudInfo').onclick = function () {
      if (!inv) { msg.textContent = 'IPC 不可用'; return; }
      inv('cloud_latest_info').then(function (v) {
        msg.textContent = v.ok
          ? ('云端最新：' + (v.latest || '无') + ' ｜ 上次同步：' + (v.lastSync || '—'))
          : ('云端查询失败：' + (v.error || '未知'));
      }).catch(function (e) { msg.textContent = '失败：' + e; });
    };
    document.getElementById('notesSync').onclick = function () {
      if (!inv) { msg.textContent = 'IPC 不可用'; return; }
      msg.textContent = '正在同步便签…';
      inv('notes_sync').then(function (r) {
        msg.textContent = r;
        return inv('page_data', { page: 'settings' });
      }).then(function (d) {
        if (d) window.renderSettings(d);
      }).catch(function (e) { msg.textContent = '失败：' + e; });
    };
  });
</script>
</body>
</html>
