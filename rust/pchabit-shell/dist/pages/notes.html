<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit 便签</title>
<style>.hint { color:var(--dim); font-size:11px; }
.grid { columns:320px; column-gap:12px; }
.note { break-inside:avoid; margin:0 0 12px; border-radius:10px; padding:10px 12px;
    border:1px solid var(--border); background:var(--surface-3); }
.note.pin { border-color:var(--amber)55; }
.bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
    font-size:10px; color:var(--dim); }
.tag { padding:1px 6px; border-radius:5px; background:var(--bg); border:1px solid var(--border); }
.body { white-space:pre-wrap; word-break:break-word; font-size:12px;
    font-family:"Consolas","Cascadia Mono","Microsoft YaHei",monospace; }
.body a { color:var(--gold-hi); text-decoration:underline; cursor:pointer; }
.body b { color:var(--gold-hi); }
.body code { background:var(--surface-2); border:1px solid var(--border); border-radius:4px;
  padding:0 4px; font-family:Consolas,"Cascadia Mono",monospace; font-size:11px; }
.body .md-h1 { font-size:14px; font-weight:600; color:var(--gold-hi); margin:5px 0 2px; }
.body .md-h2 { font-size:13px; font-weight:600; margin:4px 0 2px; }
.body .md-h3 { font-size:12.5px; font-weight:600; color:var(--dim); margin:3px 0 1px; }
.body .md-li { padding-left:9px; }
.new { background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-bottom:14px; }
.new textarea { width:100%; min-height:64px; resize:vertical; box-sizing:border-box;
    background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:6px 8px; font:12px/1.5 "Consolas","Microsoft YaHei",monospace; }
.new .row2 { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
.new select, .note select { background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:2px 6px; font-size:11px; }
.act { background:var(--surface-3); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:2px 8px; font-size:11px; cursor:pointer; }
.act.pri { background:var(--gold); border-color:var(--gold); color:#241a06; font-weight:600; }
.acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.msg { font-size:11px; color:var(--dim); }</style>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<header>
  <h1>便签</h1>
  <span class="hint" id="meta">加载中…</span>
</header>
<div class="new">
  <textarea id="nContent" placeholder="新便签内容（支持多行、链接）"></textarea>
  <div class="row2">
    <select id="nColor">
      <option value="yellow">黄</option><option value="green">绿</option>
      <option value="pink">粉</option><option value="blue">蓝</option>
      <option value="purple">紫</option>
    </select>
    <button class="act pri" id="nAdd">新建便签</button>
    <span class="msg" id="nMsg"></span>
  </div>
</div>
<div class="grid" id="grid"></div>
<script>
  var COLORS = {
    yellow: { bg:'#1f1c0d', bd:'#4d4318' },
    green:  { bg:'#0f1f16', bd:'#1e4632' },
    pink:   { bg:'#20131a', bd:'#4a2434' },
    blue:   { bg:'#0f1a26', bd:'#1d3a55' },
    purple: { bg:'#1a1326', bd:'#3a2455' },
  };

  // 只把 http(s) 链接变成可点文本，其余内容原样输出（不执行任何 HTML）
  // 简易 Markdown：标题 / 粗体 / 行内代码 / 列表 / 链接。
  // 旧版是完整的 MarkdownText 控件；这里覆盖笔记里最常用的几种，
  // 先转义再替换，不会引入 HTML 注入。
  function mdToHtml(src) {
    var s = String(src || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" data-url="$1">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/^### (.*)$/gm, '<div class="md-h3">$1</div>');
    s = s.replace(/^## (.*)$/gm, '<div class="md-h2">$1</div>');
    s = s.replace(/^# (.*)$/gm, '<div class="md-h1">$1</div>');
    s = s.replace(/^- (.*)$/gm, '<div class="md-li">· $1</div>');
    return s;
  }

  // 便签里的链接交给系统浏览器（WebView 里新开窗口不可控）
  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a[data-url]') : null;
    if (!a || !window.__TAURI__) return;
    ev.preventDefault();
    window.__TAURI__.core.invoke('open_url', { url: a.getAttribute('data-url') }).catch(function () { });
  });

  function paintBody(text) {
    var box = document.createElement('div');
    box.className = 'body';
    box.innerHTML = mdToHtml(text);
    return box;
  }

  function renderNotes(payload) {
    var items = (payload && payload.items) || [];
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var pinned = items.filter(function (n) { return n.pinned; }).length;
    document.getElementById('meta').textContent =
      items.length + ' 条（' + pinned + ' 条置顶）· 可编辑（写库，与 WPF 共用 StickyNotes）';

    if (!items.length) {
      grid.appendChild(Object.assign(document.createElement('div'),
        { className: 'empty', textContent: '还没有便签' }));
      return 'ok: 0 条';
    }
    items.forEach(function (n) {
      var pal = COLORS[n.color] || COLORS.yellow;
      var box = document.createElement('div');
      box.className = 'note' + (n.pinned ? ' pin' : '');
      box.style.background = pal.bg;
      box.style.borderColor = pal.bd;

      var bar = document.createElement('div');
      bar.className = 'bar';
      var left = document.createElement('span');
      left.className = 'tag';
      left.textContent = (n.pinned ? '置顶 · ' : '') + (n.color || 'yellow');
      var right = document.createElement('span');
      right.textContent = (n.updatedAt || '').slice(0, 16);
      bar.appendChild(left);
      bar.appendChild(right);
      box.appendChild(bar);
      box.appendChild(paintBody(n.content || ''));

      // 编辑区（默认隐藏，点「编辑」才出现，避免误改）
      var editor = document.createElement('textarea');
      editor.value = n.content || '';
      editor.style.cssText = 'display:none;width:100%;min-height:90px;resize:vertical;' +
        'box-sizing:border-box;margin-top:6px;background:var(--bg);color:var(--text);' +
        'border:1px solid #263349;border-radius:6px;padding:6px 8px;' +
        'font:12px/1.5 "Consolas","Microsoft YaHei",monospace;';
      box.appendChild(editor);

      var acts = document.createElement('div');
      acts.className = 'acts';
      var bEdit = mkBtn('编辑', 'act');
      var bSave = mkBtn('保存', 'act pri');
      bSave.style.display = 'none';
      var bPin = mkBtn(n.pinned ? '取消置顶' : '置顶', 'act');
      var bDesk = mkBtn('放到桌面', 'act');
      var bDel = mkBtn('删除', 'act');
      acts.appendChild(bEdit); acts.appendChild(bSave);
      acts.appendChild(bPin); acts.appendChild(bDesk); acts.appendChild(bDel);
      box.appendChild(acts);

      var msg = document.createElement('span');
      msg.className = 'msg';
      acts.appendChild(msg);

      bEdit.onclick = function () {
        var on = editor.style.display === 'none';
        editor.style.display = on ? 'block' : 'none';
        bSave.style.display = on ? 'inline-block' : 'none';
        bEdit.textContent = on ? '收起' : '编辑';
      };
      bSave.onclick = function () {
        call('notes_update', { id: n.id, content: editor.value }, msg, '已保存');
      };
      bPin.onclick = function () {
        call('notes_pin', { id: n.id, pinned: !n.pinned }, msg, n.pinned ? '已取消置顶' : '已置顶');
      };
      bDesk.onclick = function () {
        msg.textContent = '执行中…';
        window.__TAURI__.core.invoke('note_desktop_set', { id: n.id, on: true })
          .then(function () { msg.textContent = '已放到桌面（拖它的标题栏可移动，位置会自动记住）'; })
          .catch(function (e) { msg.textContent = '失败：' + e; });
      };
      bDel.onclick = function () {
        if (!confirm('删除这条便签？（软删除，可从 WPF 恢复）')) return;
        call('notes_delete', { id: n.id }, msg, '已删除');
      };

      grid.appendChild(box);
    });
    return 'ok: ' + items.length + ' 条便签';
  }

  function mkBtn(text, cls) {
    var b = document.createElement('button');
    b.className = cls;
    b.textContent = text;
    return b;
  }

  // 写库后重取一次载荷重绘（把结果写进 __NOTES_RESULT__，壳日志可见）
  function call(cmd, args, msgEl, okText) {
    if (!window.__TAURI__) { msgEl.textContent = '壳未注入 IPC'; return; }
    msgEl.textContent = '执行中…';
    window.__TAURI__.core.invoke(cmd, args).then(function () {
      msgEl.textContent = okText;
      return window.__TAURI__.core.invoke('page_data', { page: 'notes' });
    }).then(function (d) {
      window.__NOTES_DATA__ = d;
      window.__NOTES_RESULT__ = renderNotes(d) + ' · ' + cmd + ' ' + okText;
    }).catch(function (e) {
      msgEl.textContent = '失败：' + e;
      window.__NOTES_RESULT__ = 'error: ' + e;
    });
  }

  window.renderNotes = renderNotes;
  document.addEventListener('DOMContentLoaded', function () {
    if (window.__NOTES_DATA__) {
      try { window.__NOTES_RESULT__ = renderNotes(window.__NOTES_DATA__); }
      catch (e) { window.__NOTES_RESULT__ = 'error: ' + e.message; }
    }
    var add = document.getElementById('nAdd');
    if (add) add.onclick = function () {
      var msg = document.getElementById('nMsg');
      var content = document.getElementById('nContent').value;
      var color = document.getElementById('nColor').value;
      if (!content.trim()) { msg.textContent = '内容不能为空'; return; }
      if (!window.__TAURI__) { msg.textContent = '壳未注入 IPC'; return; }
      msg.textContent = '执行中…';
      window.__TAURI__.core.invoke('notes_create', { content: content, color: color })
        .then(function () {
          document.getElementById('nContent').value = '';
          msg.textContent = '已新建';
          return window.__TAURI__.core.invoke('page_data', { page: 'notes' });
        })
        .then(function (d) {
          window.__NOTES_DATA__ = d;
          window.__NOTES_RESULT__ = renderNotes(d) + ' · notes_create 已新建';
        })
        .catch(function (e) {
          msg.textContent = '失败：' + e;
          window.__NOTES_RESULT__ = 'error: ' + e;
        });
    };
  });
</script>
</body>
</html>
