<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#0f172a; color:#e2e8f0;
    font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }

  nav { width:188px; flex:none; background:#0b1220; border-right:1px solid #1f2937;
    display:flex; flex-direction:column; padding:14px 10px; gap:4px; box-sizing:border-box; }
  nav .brand { font-size:13px; font-weight:600; padding:4px 8px 12px; color:#e2e8f0; }
  nav .brand span { display:block; font-size:11px; font-weight:400; color:#64748b; margin-top:2px; }
  nav button {
    text-align:left; padding:9px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent;
    background:transparent; color:#cbd5e1; font-size:13px;
  }
  nav button:hover { background:#16233a; }
  nav button.active { background:#1d2f4d; border-color:#3b82f6; color:#fff; }
  nav .foot { margin-top:auto; font-size:11px; color:#475569; padding:8px; }

  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  header { height:40px; flex:none; display:flex; align-items:center; gap:12px;
    padding:0 14px; border-bottom:1px solid #1f2937; color:#94a3b8; font-size:12px; }
  header b { color:#e2e8f0; font-weight:600; font-size:13px; }
  header .spacer { flex:1; }
  header button { background:#182234; border:1px solid #263349; color:#cbd5e1;
    border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }
  header button:hover { background:#20304a; border-color:#3b82f6; color:#fff; }
  #frame { flex:1; border:0; width:100%; background:#0f172a; }
</style>
</head>
<body>
<div id="app">
  <nav>
    <div class="brand">PChabit<span>Tauri 壳 · P4</span></div>
    <button data-page="hardware">硬件趋势</button>
    <button data-page="activity">每小时活动</button>
    <button data-page="category">分类构成</button>
    <button data-page="sankey">应用切换关系</button>
    <button data-page="analytics">活动分析</button>
    <div class="foot" id="foot">—</div>
  </nav>
  <main>
    <header>
      <b id="title">硬件趋势</b><span id="meta"></span>
      <span class="spacer"></span>
      <button id="refresh" title="重新查库并重算五页载荷">刷新</button>
    </header>
    <iframe id="frame"></iframe>
  </main>
</div>
<script>
  var ASSET = { hardware:'pages/hardware-trend.html', activity:'pages/activity-trend.html',
                category:'pages/piechart.html', sankey:'pages/sankey.html',
                analytics:'pages/analytics.html' };
  var TITLE = { hardware:'硬件趋势', activity:'每小时活动', category:'分类构成',
                sankey:'应用切换关系', analytics:'活动分析' };

  var frame = document.getElementById('frame');
  var current = null;

  function note(msg) {
    try {
      if (window.__TAURI__) window.__TAURI__.core.invoke('note', { msg: msg });
    } catch (e) { /* 记日志失败不影响页面 */ }
  }

  // 数据在窗口创建时由壳一次算好注入（window.__PAGES__），渲染阶段完全不走 IPC
  function dataFor(page) { return (window.__PAGES__ || {})[page]; }

  // 每页自己的"喂数据 + 触发绘制"（函数由页面自身导出，壳只调用）
  function feed(page, w, d) {
    if (!d) throw new Error('没有拿到 ' + page + ' 的数据');
    if (page === 'hardware') {
      w.__HW_DATA__ = d;
      if (w.draw) w.draw(d);
    } else if (page === 'activity') {
      w.__ACT_DATA__ = d;
      if (w.draw) w.draw(d);        // 只传 data，不传 dark：页面里 draw/applyTheme 会互相递归
    } else if (page === 'category') {
      // 两种口径：按分类（全部）/ 按应用（Top8 + 其他）——对齐 WPF 的 PieMode
      var mode = w.__PIE_MODE__ || 'byCategory';
      pieToggle(w, d);
      renderPie(w, d, mode);
    } else if (page === 'sankey') {
      if (w.renderSankey) w.renderSankey(d);
    } else if (page === 'analytics') {
      w.__ANA_DATA__ = d;
      if (w.renderAnalytics) w.__ANA_RESULT__ = w.renderAnalytics(d);
    }
  }

  function renderPie(w, d, mode) {
    var arr = (mode === 'byApp' ? d.byApp : d.byCategory) || [];
    w.document.getElementById('meta-note') &&
      (w.document.getElementById('meta-note').textContent =
        (mode === 'byApp' ? '按应用' : '按分类') + ' · ' + arr.length + ' 项');
    if (w.renderPieChart) w.renderPieChart(arr);
    w.__PIE_MODE__ = mode;
    return arr.length;
  }

  // 饼图页自身没有模式切换（WPF 是外部按钮），这里由壳在 iframe 里挂一个浮层
  function pieToggle(w, d) {
    var doc = w.document;
    if (!doc || !doc.body) return;
    var bar = doc.getElementById('__pie_toggle');
    if (!bar) {
      bar = doc.createElement('div');
      bar.id = '__pie_toggle';
      bar.style.cssText = 'position:fixed;top:6px;right:8px;z-index:9;display:flex;' +
        'gap:4px;font:12px "Microsoft YaHei",sans-serif;';
      function mk(mode, text) {
        var b = doc.createElement('button');
        b.dataset.mode = mode;
        b.textContent = text;
        b.style.cssText = 'background:#182234;border:1px solid #263349;color:#cbd5e1;' +
          'border-radius:6px;padding:3px 9px;cursor:pointer;';
        b.addEventListener('click', function () {
          renderPie(w, window.__PAGES__.category, mode);
          paint();
        });
        return b;
      }
      bar.appendChild(mk('byCategory', '按分类'));
      bar.appendChild(mk('byApp', '按应用'));
      doc.body.appendChild(bar);
      function paint() {
        var cur = w.__PIE_MODE__ || 'byCategory';
        Array.prototype.forEach.call(bar.querySelectorAll('button'), function (b) {
          var on = b.dataset.mode === cur;
          b.style.background = on ? '#2563eb' : '#182234';
          b.style.borderColor = on ? '#3b82f6' : '#263349';
          b.style.color = on ? '#fff' : '#cbd5e1';
        });
      }
      bar.__paint = paint;
    }
    if (bar.__paint) bar.__paint();
  }

  function setActive(page) {
    document.querySelectorAll('nav button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.page === page);
    });
    document.getElementById('title').textContent = TITLE[page] || page;
  }

  function load(page) {
    if (!ASSET[page]) { document.getElementById('meta').textContent = '未知页面'; return; }
    current = page;
    setActive(page);
    document.getElementById('meta').textContent = '加载中…';
    frame.src = ASSET[page];
  }

  frame.addEventListener('load', function () {
    var page = current;
    if (!page) return;
    var meta = document.getElementById('meta');
    try {
      var d = dataFor(page);
      // 自测钩子：?pie=byApp 强制以"按应用"口径渲染
      var forcePie = new URLSearchParams(location.search).get('pie');
      if (page === 'category' && forcePie) frame.contentWindow.__PIE_MODE__ = forcePie;
      feed(page, frame.contentWindow, d);
      if (page === 'category') {
        var mode = frame.contentWindow.__PIE_MODE__ || 'byCategory';
        var arr = (mode === 'byApp' ? d.byApp : d.byCategory) || [];
        meta.textContent = (mode === 'byApp' ? '按应用' : '按分类') + ' · ' + arr.length + ' 项' +
          '　（另一口径：' + (mode === 'byApp' ? ((d.byCategory || []).length + ' 分类')
            : ((d.byApp || []).length + ' 应用')) + '）';
      } else {
        meta.textContent = (d && d.summary) ? d.summary : '已加载';
      }
      var extra = '';
      if (page === 'analytics' && frame.contentWindow.__ANA_RESULT__) {
        extra = ' ' + frame.contentWindow.__ANA_RESULT__;
      } else if (page === 'category') {
        var pieMode = frame.contentWindow.__PIE_MODE__ || 'byCategory';
        var pieArr = (pieMode === 'byApp' ? d.byApp : d.byCategory) || [];
        extra = ' ' + (pieMode === 'byApp' ? '按应用 ' : '按分类 ') + pieArr.length + ' 项';
      }
      note(page + ' 已渲染' + extra);
    } catch (e) {
      meta.textContent = '渲染失败：' + e.message;
      note(page + ' 渲染失败：' + e.message);
    }
  });

  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { load(b.dataset.page); });
  });

  var pages = window.__PAGES__ || {};
  document.getElementById('foot').textContent =
    '数据：壳内 Rust 直读 SQLite · ' + Object.keys(pages).length + ' 页已注入';

  // 刷新：重算全部载荷后重新加载当前页（load 事件会再喂一次数据）
  function refresh() {
    var meta = document.getElementById('meta');
    meta.textContent = '刷新中…';
    window.__TAURI__.core.invoke('pages_data').then(function (p) {
      window.__PAGES__ = p;
      var pagesNow = Object.keys(p).length;
      document.getElementById('foot').textContent =
        '数据：壳内 Rust 直读 SQLite · ' + pagesNow + ' 页 · 刷新于 ' +
        new Date().toLocaleTimeString('zh-CN');
      note('refresh 完成 ' + pagesNow + ' 页');
      if (current) frame.src = ASSET[current];
    }).catch(function (e) {
      meta.textContent = '刷新失败：' + e;
      note('refresh 失败：' + e);
    });
  }
  document.getElementById('refresh').addEventListener('click', refresh);

  // 命令行直开：app.html?p=sankey　自测刷新：再加 &auto=1
  var q = new URLSearchParams(location.search).get('p');
  load(ASSET[q] ? q : 'hardware');
  if (new URLSearchParams(location.search).get('auto') === '1') {
    setTimeout(refresh, 2500);
  }
</script>
</body>
</html>
