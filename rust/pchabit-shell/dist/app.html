<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PChabit</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#0f172a; color:#e2e8f0;
    font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }

  nav { width:188px; flex:none; background:#0b1220; border-right:1px solid #1f2937;
    display:flex; flex-direction:column; padding:14px 10px; gap:4px; box-sizing:border-box; }
  nav .brand { font-size:13px; font-weight:600; padding:4px 8px 12px; color:#e2e8f0; }
  nav .brand span { display:block; font-size:11px; font-weight:400; color:#64748b; margin-top:2px; }
  nav button {
    text-align:left; padding:9px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent;
    background:transparent; color:#cbd5e1; font-size:13px;
  }
  nav button:hover { background:#16233a; }
  nav button.active { background:#1d2f4d; border-color:#3b82f6; color:#fff; }
  nav .foot { margin-top:auto; font-size:11px; color:#475569; padding:8px; }
  nav .ver { font-size:10px; color:#334155; padding:0 8px 8px; }

  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  header { height:40px; flex:none; display:flex; align-items:center; gap:12px;
    padding:0 14px; border-bottom:1px solid #1f2937; color:#94a3b8; font-size:12px; }
  header b { color:#e2e8f0; font-weight:600; font-size:13px; }
  header .spacer { flex:1; }
  header button { background:#182234; border:1px solid #263349; color:#cbd5e1;
    border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }
  header button:hover { background:#20304a; border-color:#3b82f6; color:#fff; }
  #frame { flex:1; border:0; width:100%; background:#0f172a; }
</style>
</head>
<body>
<div id="app">
  <nav>
    <div class="brand">PChabit<span>Tauri 壳 · P4</span></div>
    <button data-page="dashboard">仪表盘</button>
    <button data-page="hardware">硬件趋势</button>
    <button data-page="activity">每小时活动</button>
    <button data-page="timeline">时间线</button>
    <button data-page="category">分类构成</button>
    <button data-page="sankey">应用切换关系</button>
    <button data-page="analytics">活动分析</button>
    <button data-page="web">网页访问</button>
    <button data-page="net">网络流量</button>
    <button data-page="input">键鼠活动</button>
    <button data-page="reports">历史报告</button>
    <button data-page="admin">分类管理</button>
    <button data-page="detail">应用详情</button>
    <button data-page="settings">设置概览</button>
    <button data-page="notes">便签</button>
    <button data-page="data">数据管理</button>
    <div class="spacer"></div>
    <div class="ver" id="ver"></div>
    <div class="foot" id="foot">—</div>
  </nav>
  <main>
    <header>
      <b id="title">仪表盘</b><span id="meta"></span>
      <span class="spacer"></span>
      <button id="refresh" title="重新查库并重算五页载荷">刷新</button>
    </header>
    <iframe id="frame"></iframe>
  </main>
</div>
<script>
  var ASSET = { hardware:'pages/hardware-trend.html', activity:'pages/activity-trend.html',
                category:'pages/piechart.html', sankey:'pages/sankey.html',
                analytics:'pages/analytics.html', admin:'pages/categories.html',
                detail:'pages/detail.html', settings:'pages/settings.html',
                notes:'pages/notes.html', web:'pages/web.html',
                timeline:'pages/timeline.html', dashboard:'pages/dashboard.html',
                net:'pages/net.html', input:'pages/input.html',
                reports:'pages/reports.html', data:'pages/data.html' };
  var TITLE = { hardware:'硬件趋势', activity:'每小时活动', category:'分类构成',
                sankey:'应用切换关系', analytics:'活动分析', admin:'分类管理',
                detail:'应用详情', settings:'设置概览',
                notes:'便签', web:'网页访问', timeline:'时间线',
                dashboard:'仪表盘', net:'网络流量', input:'键鼠活动',
                reports:'历史报告', data:'数据管理' };

  var frame = document.getElementById('frame');
  var current = null;

  function note(msg) {
    try {
      if (window.__TAURI__) window.__TAURI__.core.invoke('note', { msg: msg });
    } catch (e) { /* 记日志失败不影响页面 */ }
  }

  // 数据在窗口创建时由壳一次算好注入（window.__PAGES__），渲染阶段完全不走 IPC
  function dataFor(page) { return (window.__PAGES__ || {})[page]; }

  // 每页自己的"喂数据 + 触发绘制"（函数由页面自身导出，壳只调用）
  function feed(page, w, d) {
    if (!d) throw new Error('没有拿到 ' + page + ' 的数据');
    if (page === 'hardware') {
      w.__HW_DATA__ = d;
      if (w.draw) w.draw(d);
    } else if (page === 'activity') {
      w.__ACT_DATA__ = d;
      if (w.draw) w.draw(d);        // 只传 data，不传 dark：页面里 draw/applyTheme 会互相递归
    } else if (page === 'category') {
      // 两种口径：按分类（全部）/ 按应用（Top8 + 其他）——对齐 WPF 的 PieMode
      var mode = w.__PIE_MODE__ || 'byCategory';
      pieToggle(w, d);
      renderPie(w, d, mode);
    } else if (page === 'sankey') {
      if (w.renderSankey) w.renderSankey(d);
    } else if (page === 'analytics') {
      w.__ANA_DATA__ = d;
      if (w.renderAnalytics) w.__ANA_RESULT__ = w.renderAnalytics(d);
    } else if (page === 'admin') {
      w.__ADMIN_DATA__ = d;
      if (w.renderAdmin) w.__ADMIN_RESULT__ = w.renderAdmin(d);
    } else if (page === 'settings') {
      w.__SET_DATA__ = d;
      if (w.renderSettings) w.__SET_RESULT__ = w.renderSettings(d);
    } else if (page === 'detail') {
      w.__DETAIL_DATA__ = d;
      if (w.renderDetail) w.__DETAIL_RESULT__ = w.renderDetail(d);
    } else if (page === 'notes') {
      w.__NOTES_DATA__ = d;
      if (w.renderNotes) w.__NOTES_RESULT__ = w.renderNotes(d);
    } else if (page === 'timeline') {
      w.__TL_DATA__ = d;
      if (w.renderTimeline) {
        try { w.__TL_RESULT__ = w.renderTimeline(d); }
        catch (e) { w.__TL_RESULT__ = 'error: ' + e.message; }
      }
    } else if (page === 'web') {
      w.__WEB_DATA__ = d;
      if (w.renderWeb) {
        try { w.__WEB_RESULT__ = w.renderWeb(d); }
        catch (e) { w.__WEB_RESULT__ = 'error: ' + e.message; }
      }
    } else if (page === 'dashboard') {
      w.__DASH_DATA__ = d;
      if (w.renderDashboard) {
        try { w.__DASH_RESULT__ = w.renderDashboard(d); }
        catch (e) { w.__DASH_RESULT__ = 'error: ' + e.message; }
      }
    } else if (page === 'net') {
      w.__NET_DATA__ = d;
      if (w.renderNet) {
        try { w.__NET_RESULT__ = w.renderNet(d); }
        catch (e) { w.__NET_RESULT__ = 'error: ' + e.message; }
      }
    } else if (page === 'input') {
      w.__INPUT_DATA__ = d;
      if (w.renderInput) {
        try { w.__INPUT_RESULT__ = w.renderInput(d); }
        catch (e) { w.__INPUT_RESULT__ = 'error: ' + e.message; }
      }
    } else if (page === 'reports') {
      w.__REP_DATA__ = d;
      if (w.renderReports) {
        try { w.__REP_RESULT__ = w.renderReports(d); }
        catch (e) { w.__REP_RESULT__ = 'error: ' + e.message; }
      }
    } else if (page === 'data') {
      w.__DATA_DATA__ = d;
      if (w.renderData) {
        try { w.__DATA_RESULT__ = w.renderData(d); }
        catch (e) { w.__DATA_RESULT__ = 'error: ' + e.message; }
      }
    }
  }

  function renderPie(w, d, mode) {
    var arr = (mode === 'byApp' ? d.byApp : d.byCategory) || [];
    w.document.getElementById('meta-note') &&
      (w.document.getElementById('meta-note').textContent =
        (mode === 'byApp' ? '按应用' : '按分类') + ' · ' + arr.length + ' 项');
    if (w.renderPieChart) w.renderPieChart(arr);
    w.__PIE_MODE__ = mode;
    return arr.length;
  }

  // 饼图页自身没有模式切换（WPF 是外部按钮），这里由壳在 iframe 里挂一个浮层
  function pieToggle(w, d) {
    var doc = w.document;
    if (!doc || !doc.body) return;
    var bar = doc.getElementById('__pie_toggle');
    if (!bar) {
      bar = doc.createElement('div');
      bar.id = '__pie_toggle';
      bar.style.cssText = 'position:fixed;top:6px;right:8px;z-index:9;display:flex;' +
        'gap:4px;font:12px "Microsoft YaHei",sans-serif;';
      function mk(mode, text) {
        var b = doc.createElement('button');
        b.dataset.mode = mode;
        b.textContent = text;
        b.style.cssText = 'background:#182234;border:1px solid #263349;color:#cbd5e1;' +
          'border-radius:6px;padding:3px 9px;cursor:pointer;';
        b.addEventListener('click', function () {
          renderPie(w, window.__PAGES__.category, mode);
          paint();
        });
        return b;
      }
      bar.appendChild(mk('byCategory', '按分类'));
      bar.appendChild(mk('byApp', '按应用'));
      doc.body.appendChild(bar);
      function paint() {
        var cur = w.__PIE_MODE__ || 'byCategory';
        Array.prototype.forEach.call(bar.querySelectorAll('button'), function (b) {
          var on = b.dataset.mode === cur;
          b.style.background = on ? '#2563eb' : '#182234';
          b.style.borderColor = on ? '#3b82f6' : '#263349';
          b.style.color = on ? '#fff' : '#cbd5e1';
        });
      }
      bar.__paint = paint;
    }
    if (bar.__paint) bar.__paint();
  }

  function setActive(page) {
    document.querySelectorAll('nav button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.page === page);
    });
    document.getElementById('title').textContent = TITLE[page] || page;
  }

  function load(page) {
    if (!ASSET[page]) { document.getElementById('meta').textContent = '未知页面'; return; }
    current = page;
    setActive(page);
    document.getElementById('meta').textContent = '加载中…';
    frame.src = ASSET[page];
  }

  frame.addEventListener('load', function () {
    var page = current;
    if (!page) return;
    var meta = document.getElementById('meta');
    try {
      var d = dataFor(page);
      // 自测钩子：?pie=byApp 强制以"按应用"口径渲染
      var forcePie = new URLSearchParams(location.search).get('pie');
      if (page === 'category' && forcePie) frame.contentWindow.__PIE_MODE__ = forcePie;
      feed(page, frame.contentWindow, d);
      if (page === 'category') {
        var mode = frame.contentWindow.__PIE_MODE__ || 'byCategory';
        var arr = (mode === 'byApp' ? d.byApp : d.byCategory) || [];
        meta.textContent = (mode === 'byApp' ? '按应用' : '按分类') + ' · ' + arr.length + ' 项' +
          '　（另一口径：' + (mode === 'byApp' ? ((d.byCategory || []).length + ' 分类')
            : ((d.byApp || []).length + ' 应用')) + '）';
      } else {
        meta.textContent = (d && d.summary) ? d.summary : '已加载';
      }
      var extra = '';
      if (page === 'analytics' && frame.contentWindow.__ANA_RESULT__) {
        extra = ' ' + frame.contentWindow.__ANA_RESULT__;
      } else if (page === 'category') {
        var pieMode = frame.contentWindow.__PIE_MODE__ || 'byCategory';
        var pieArr = (pieMode === 'byApp' ? d.byApp : d.byCategory) || [];
        extra = ' ' + (pieMode === 'byApp' ? '按应用 ' : '按分类 ') + pieArr.length + ' 项';
      } else if (page === 'admin') {
        var adminArr = (d && d.apps && d.apps.items) || [];
        meta.textContent = adminArr.length + ' 个进程 · 分类可直接改（写入数据库）';
        extra = ' ' + ((frame.contentWindow.__ADMIN_RESULT__) || '');
      } else if (page === 'detail') {
        var appsN = (d && d.apps && d.apps.items) || [];
        meta.textContent = appsN.length + ' 个应用 · 点选查看详情';
        extra = ' ' + ((frame.contentWindow.__DETAIL_RESULT__) || '');
      } else if (page === 'settings') {
        meta.textContent = (d && d.count ? d.count : 0) + ' 项设置（只读，敏感项已打码）';
        extra = ' ' + ((frame.contentWindow.__SET_RESULT__) || '');
      } else if (page === 'notes') {
        var notesN = (d && d.items) || [];
        meta.textContent = notesN.length + ' 条便签（只读，编辑请在 PChabit 里进行）';
        extra = ' ' + ((frame.contentWindow.__NOTES_RESULT__) || '');
      } else if (page === 'timeline') {
        meta.textContent = (d && d.label ? d.label : '') + (d && d.weekday ? '　' + d.weekday : '') +
          ' · ' + ((d && d.appCount) || 0) + ' 个应用（只读）';
        extra = ' ' + ((frame.contentWindow.__TL_RESULT__) || '');
      } else if (page === 'web') {
        var ws = (d && d.summary) || {};
        meta.textContent = (ws.totalVisits || 0) + ' 次访问 · ' + (ws.uniqueDomains || 0) +
          ' 个域名（只读）';
        extra = ' ' + ((frame.contentWindow.__WEB_RESULT__) || '');
      } else if (page === 'dashboard') {
        meta.textContent = (d && d.label ? d.label : '') +
          (d && d.weekday ? ' ' + d.weekday : '') + ' · ' +
          ((d && d.appCount) || 0) + ' 个应用 · ' +
          ((d && d.sessions) || 0) + ' 次会话';
        extra = ' ' + ((frame.contentWindow.__DASH_RESULT__) || '');
      } else if (page === 'net') {
        var nr = (d && d.range) || {};
        meta.textContent = (nr.start || '') + ' ~ ' + (nr.end || '') + ' · 下 ' +
          ((d && d.totalDownText) || '-') + ' / 上 ' + ((d && d.totalUpText) || '-') +
          '（只读）';
        extra = ' ' + ((frame.contentWindow.__NET_RESULT__) || '');
      } else if (page === 'input') {
        meta.textContent = ((d && d.keyRows) || 0) + ' 行键盘记录 · ' +
          (((d && d.topKeys) || []).length) + ' 个应用（只读）';
        extra = ' ' + ((frame.contentWindow.__INPUT_RESULT__) || '');
      } else if (page === 'reports') {
        meta.textContent = ((d && d.count) || 0) + ' 周汇总 · 周一为起点（只读）';
        extra = ' ' + ((frame.contentWindow.__REP_RESULT__) || '');
      } else if (page === 'data') {
        meta.textContent = ((d && d.sizeText) || '-') + ' + wal ' + ((d && d.walText) || '-') +
          ' · ' + (((d && d.tables) || []).length) + ' 张表（只读）';
        extra = ' ' + ((frame.contentWindow.__DATA_RESULT__) || '');
      }
      note(page + ' 已渲染' + extra);

      // 自测钩子：?wtest=... 走一遍写库（配合 PCHABIT_DB 指向库副本）
      //   进程名|分类名      改某进程的分类
      //   cat:名称            新建分类
      //   on:Id / off:Id      启用/停用分类
      var wtest = new URLSearchParams(location.search).get('wtest');
      if (page === 'admin' && wtest) {
        var call;
        if (wtest.indexOf('cat:') === 0) {
          call = window.__TAURI__.core.invoke('create_category', {
            name: wtest.slice(4), color: '#22C55E', icon: '📚'
          });
        } else if (wtest.indexOf('on:') === 0 || wtest.indexOf('off:') === 0) {
          var actArgs = {
            id: parseInt(wtest.replace(/^on:|^off:/, ''), 10),
            active: wtest.indexOf('on:') === 0
          };
          note('wtest 参数 ' + JSON.stringify(actArgs));
          call = window.__TAURI__.core.invoke('set_category_active', actArgs);
        } else {
          var parts = wtest.split('|');
          call = window.__TAURI__.core.invoke('set_category', { process: parts[0], category: parts[1] });
        }
        call.then(function (r) {
          note('wtest 结果 ' + JSON.stringify(r));
          return window.__TAURI__.core.invoke('page_data', { page: 'admin' });
        })
        .then(function (d) {
          var cats = (d.categories || []).filter(function (c) { return c.active; }).length;
          note('wtest 重读 admin: ' + ((d.apps && d.apps.items) || []).length +
            ' 进程 / ' + cats + ' 启用分类（共 ' + (d.categories || []).length + ' 条）');
          return window.__TAURI__.core.invoke('pages_data');
        })
        .then(function (p) {
          window.__PAGES__ = p;
          note('wtest 载荷重算完成 ' + Object.keys(p).length + ' 页');
        })
        .catch(function (e) { note('wtest 失败：' + e); });
      }

      // 自测钩子：?dtest=1 验证数据管理写库（备份 + 清理），配合 PCHABIT_DB 指向库副本
      var dtest = new URLSearchParams(location.search).get('dtest');
      if (page === 'data' && dtest) {
        window.__TAURI__.core.invoke('backup_db', {})
          .then(function (r) {
            note('dtest 备份 ' + r);
            return window.__TAURI__.core.invoke('cleanup_data', { days: parseInt(dtest, 10) || 3650 });
          })
          .then(function (r) {
            note('dtest 清理 ' + r);
            return window.__TAURI__.core.invoke('page_data', { page: 'data' });
          })
          .then(function (d) {
            note('dtest 重读 data: ' + (d.sizeText || '') + ' / ' +
              ((d.tables || []).length) + ' 表 / ' + ((d.backups || []).length) + ' 备份');
          })
          .catch(function (e) { note('dtest 失败：' + e); });
      }

      // 自测钩子：?ntest=1 验证便签写库（新建 → 改 → 置顶 → 删），配合 PCHABIT_DB 指向库副本
      if (page === 'notes' && new URLSearchParams(location.search).get('ntest') === '1') {
        var nid = null;
        window.__TAURI__.core.invoke('notes_create', { content: '壳自测便签\n第二行', color: 'green' })
          .then(function (id) { nid = id; note('ntest 新建 ' + id); })
          .then(function () { return window.__TAURI__.core.invoke('notes_update', { id: nid, content: '壳自测便签（已改）' }); })
          .then(function () { note('ntest 修改 ok'); })
          .then(function () { return window.__TAURI__.core.invoke('notes_pin', { id: nid, pinned: true }); })
          .then(function () { note('ntest 置顶 ok'); })
          .then(function () { return window.__TAURI__.core.invoke('notes_delete', { id: nid }); })
          .then(function () { note('ntest 删除 ok'); })
          .then(function () { return window.__TAURI__.core.invoke('page_data', { page: 'notes' }); })
          .then(function (d) {
            var live = (d.items || []).filter(function (x) { return !x.id ? false : x.content.indexOf('壳自测便签') === 0; });
            note('ntest 重读：共 ' + ((d.items || []).length) + ' 条，自测残留 ' + live.length + ' 条（应为 0）');
          })
          .catch(function (e) { note('ntest 失败：' + e); });
      }

      // 自测钩子：?stest=1 验证设置写回（写入与当前相同的值，不改行为）
      if (page === 'settings' && new URLSearchParams(location.search).get('stest') === '1') {
        window.__TAURI__.core.invoke('set_setting', { key: 'DataRetentionDays', value: 180 })
          .then(function (r) {
            note('stest 写入 ' + r);
            return window.__TAURI__.core.invoke('page_data', { page: 'settings' });
          })
          .then(function (d) {
            var it = (d.items || []).filter(function (x) { return x.key === 'DataRetentionDays'; })[0];
            note('stest 重读 DataRetentionDays=' + (it ? it.value : '?') + ' 共 ' + (d.count || 0) + ' 项');
          })
          .catch(function (e) { note('stest 失败：' + e); });
      }

      // 自测钩子：?tltest=-1 验证换天命令（时间线页专用）
      var tltest = new URLSearchParams(location.search).get('tltest');
      if (page === 'timeline' && tltest) {
        window.__TAURI__.core.invoke('timeline_day', { offset: parseInt(tltest, 10) })
          .then(function (d) {
            note('tltest 结果 ' + (d.label || d.date) + ' ' + (d.weekday || '') +
              ' / ' + (d.appCount || 0) + ' 应用 / ' +
              ((d.segments || []).length) + ' 块 / offset=' + d.offset +
              ' / ' + ((d.ms || 0).toFixed(1)) + ' ms');
            frame.contentWindow.__TL_DATA__ = d;
            var r = frame.contentWindow.renderTimeline(d);
            note('tltest 重绘 ' + r);
          })
          .catch(function (e) { note('tltest 失败：' + e); });
      }
    } catch (e) {
      meta.textContent = '渲染失败：' + e.message;
      note(page + ' 渲染失败：' + e.message);
    }
  });

  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { load(b.dataset.page); });
  });

  var pages = window.__PAGES__ || {};
  document.getElementById('ver').textContent = 'v' + (window.__VER__ || '—') + ' · 预览';
  document.getElementById('foot').textContent =
    '数据：壳内 Rust 直读 SQLite · ' + Object.keys(pages).length + ' 页已注入';

  // 刷新：重算全部载荷后重新加载当前页（load 事件会再喂一次数据）
  function refresh() {
    var meta = document.getElementById('meta');
    meta.textContent = '刷新中…';
    window.__TAURI__.core.invoke('pages_data').then(function (p) {
      window.__PAGES__ = p;
      var pagesNow = Object.keys(p).length;
      document.getElementById('foot').textContent =
        '数据：壳内 Rust 直读 SQLite · ' + pagesNow + ' 页 · 刷新于 ' +
        new Date().toLocaleTimeString('zh-CN');
      note('refresh 完成 ' + pagesNow + ' 页');
      if (current) frame.src = ASSET[current];
    }).catch(function (e) {
      meta.textContent = '刷新失败：' + e;
      note('refresh 失败：' + e);
    });
  }
  document.getElementById('refresh').addEventListener('click', refresh);

  // 常驻自动刷新：60 s 重取一次载荷并按当前页重绘（写库页跳过，免得打断操作）
  function refreshLive() {
    if (!window.__TAURI__ || !current) return;
    if (current === 'admin' || current === 'notes' || current === 'data') return;
    window.__TAURI__.core.invoke('pages_data').then(function (p) {
      window.__PAGES__ = p;
      var w = frame.contentWindow;
      if (!w || !dataFor) return;
      feed(current, w, dataFor(current));
      note(current + ' 已自动刷新（' + new Date().toTimeString().slice(0, 5) + '）');
    }).catch(function (e) { note('自动刷新失败：' + e); });
  }

  // 命令行直开：app.html?p=sankey　自测刷新：再加 &auto=1
  var q = new URLSearchParams(location.search).get('p');
  load(ASSET[q] ? q : 'dashboard');
  if (new URLSearchParams(location.search).get('auto') === '1') {
    setTimeout(refresh, 2500);
  } else if (!new URLSearchParams(location.search).get('dtest')) {
    // 常驻窗口每分钟刷新一次，数据页/管理页操作期间不打扰
    setInterval(refreshLive, 60000);
  }
</script>
</body>
</html>
