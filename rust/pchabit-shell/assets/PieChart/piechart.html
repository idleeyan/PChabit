<!DOCTYPE html>
<html>
<head>
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="tokens.css" />
    <meta charset="utf-8">
    <script src="echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            /* 自己铺深色底：以前写 transparent，单独打开这一页时画布是白的，
               而图例文字按深色主题取近白色 → 白底白字几乎看不见 */
            background: var(--bg);
            color: #f4efe4;
            overflow: hidden;
        }
        #chart { width: 100%; height: 100%; }
        #empty {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b7ad9b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
        }
        #empty-icon { font-size: 48px; margin-bottom: 16px; }
        #empty-text { font-size: 16px; }

        @media (prefers-color-scheme: dark) {
            #empty { color: #b7ad9b; }
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <div id="empty" style="display: none;">
        <div id="empty-icon">📊</div>
        <div id="empty-text">暂无数据</div>
    </div>
    <script>
        var chart = null;
        var __pieData = null;

        function isDark() {
            // 这一页固定深色底（见上面 html/body 的 background），
            // 不再跟随 prefers-color-scheme：否则系统浅色时会用深色字画在深底上，同样糊成一片
            return true;
        }

        // 颜色跟随 tokens.css：切换配色方案时无需重建图表
        function cssVar(name, fb) {
            try {
                var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
                return v || fb;
            } catch (e) { return fb; }
        }
        function themeText()   { return cssVar('--text', '#f4efe4'); }
        function themeSub()    { return cssVar('--dim', '#b7ad9b'); }
        function themeBorder() { return cssVar('--border', '#3c4043'); }
        function tooltipBg()   { return cssVar('--surface-2', '#1a1d22'); }
        function sliceBorder() { return cssVar('--bg', '#0a0907'); }

        function showEmpty() {
            document.getElementById('chart').style.display = 'none';
            document.getElementById('empty').style.display = 'flex';
        }

        function hideEmpty() {
            document.getElementById('chart').style.display = 'block';
            document.getElementById('empty').style.display = 'none';
        }

        // ECharts 默认色板，与应用 Token 对齐（#3B82F6 #10B981 #F59E0B #8B5CF6 #60A5FA #EF4444）
        var PALETTE = ['#e0b95f', '#c98b4b', '#9b7b5e', '#8f9a6a', '#5fb3c4', '#9b7bb8', '#d1735f', '#7d8a9e', '#b8a06a'];

        function renderPieChart(data) {
            try {
                __pieData = data;
                if (!data || data.length === 0) {
                    showEmpty();
                    return 'error: no data';
                }

                hideEmpty();

                // 复用图表实例，不重建（修复每次 dispose+init 导致的闪烁与开销）
                var el = document.getElementById('chart');
                if (!chart || chart.isDisposed()) {
                    chart = echarts.init(el);
                }

                var pieData = data.map(function(item, index) {
                    return {
                        name: item.name,
                        value: item.value,
                        itemStyle: {
                            color: item.color || PALETTE[index % PALETTE.length]
                        }
                    };
                });

                var totalMinutes = data.reduce(function(sum, item) {
                    return sum + (item.value || 0);
                }, 0);

                chart.setOption({
                    color: PALETTE,
                    tooltip: {
                        trigger: 'item',
                        backgroundColor: tooltipBg(),
                        borderColor: themeBorder(),
                        borderWidth: 1,
                        textStyle: {
                            color: themeText()
                        },
                        formatter: function(params) {
                            var mins = params.value || 0;
                            var hours = Math.floor(mins / 60);
                            var minutes = Math.round(mins % 60);
                            var timeStr = hours > 0 ? hours + '小时' + minutes + '分钟' : minutes + '分钟';
                            return '<div style="padding: 4px 8px;"><strong style="font-size: 14px;">' + params.name + '</strong><br/><span style="color: ' + themeSub() + ';">' + timeStr + '</span><br/><span style="color: ' + themeSub() + ';">占比: ' + params.percent.toFixed(1) + '%</span></div>';
                        }
                    },
                    legend: {
                        orient: 'vertical',
                        right: 18,
                        top: 'center',
                        itemWidth: 14,
                        itemHeight: 14,
                        itemGap: 9,
                        // 字号 12 在这块窄条上偏小、且原来是浅灰低对比；抬到 13 并换成近白
                        textStyle: {
                            fontSize: 13,
                            color: themeText(),
                            lineHeight: 18
                        },
                        formatter: function(name) {
                            var item = data.find(function(d) { return d.name === name; });
                            if (item) {
                                var mins = item.value || 0;
                                var hours = Math.floor(mins / 60);
                                var minutes = Math.round(mins % 60);
                                var timeStr = hours > 0 ? hours + 'h' + minutes + 'm' : Math.round(mins) + 'm';
                                return name + ' (' + timeStr + ')';
                            }
                            return name;
                        }
                    },
                    series: [{
                        type: 'pie',
                        radius: ['45%', '70%'],
                        center: ['35%', '50%'],
                        avoidLabelOverlap: true,
                        itemStyle: {
                            borderRadius: 6,
                            borderColor: sliceBorder(),
                            borderWidth: 2
                        },
                        label: {
                            show: false
                        },
                        emphasis: {
                            label: {
                                show: false
                            },
                            itemStyle: {
                                shadowBlur: 20,
                                shadowColor: 'rgba(0, 0, 0, 0.3)'
                            }
                        },
                        labelLine: {
                            show: false
                        },
                        data: pieData
                    }]
                }, true);

                return 'success: ' + pieData.length + ' items';
            } catch (e) {
                return 'error: ' + e.message;
            }
        }

        function resize() {
            if (chart && !chart.isDisposed()) chart.resize();
        }

        window.onresize = resize;

        // 主题切换时自动重绘
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
                if (chart && !chart.isDisposed() && __pieData) {
                    renderPieChart(__pieData);
                }
            });
        }
    </script>
</body>
</html>
