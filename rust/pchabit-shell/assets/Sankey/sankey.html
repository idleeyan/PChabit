<!DOCTYPE html>
<html>
<head>
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="tokens.css" />
    <meta charset="utf-8">
    <script src="echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            font-family: var(--font, "Segoe UI", "Microsoft YaHei", sans-serif);
        }

        /* 顶部工具栏：范围按钮 + 当前区间说明（原来满屏画布，没有可交互区） */
        .tbar {
            flex: none;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .tbar .ttl {
            font-size: 13.5px; font-weight: 600; letter-spacing: .06em;
            color: var(--gold-hi); white-space: nowrap;
        }
        .tbar .ranges { display: flex; gap: 5px; }
        .tbar .ranges button {
            font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 6px;
            cursor: pointer; border: 1px solid var(--border);
            background: var(--surface-2); color: var(--dim);
            transition: border-color .14s, color .14s, background .14s;
        }
        .tbar .ranges button:hover { border-color: var(--gold); color: var(--gold-hi); }
        .tbar .ranges button.on {
            background: var(--gold-soft); border-color: var(--gold);
            color: var(--gold-hi); font-weight: 600;
        }
        .tbar .meta {
            margin-left: auto; font-size: 11.5px; color: var(--mute);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        #chart { flex: 1; min-height: 0; width: 100%; }
        #empty {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--dim);
        }
        #empty-icon { font-size: 44px; margin-bottom: 14px; }
        #empty-text { font-size: 15px; }
    </style>
</head>
<body>
    <div class="tbar">
        <span class="ttl">应用切换关系</span>
        <div class="ranges" id="ranges">
            <button data-days="1">今天</button>
            <button data-days="7" class="on">近 7 天</button>
            <button data-days="30">近 30 天</button>
            <button data-days="90">近 90 天</button>
            <button data-days="0">全部</button>
        </div>
        <span class="meta" id="meta"></span>
    </div>
    <div id="chart"></div>
    <div id="empty" style="display: none;">
        <div id="empty-icon">📊</div>
        <div id="empty-text">暂无数据</div>
    </div>
    <script>
    function cssVar(name, fb) {
        try {
            var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            return v || fb;
        } catch (e) { return fb; }
    }
        var chart = null;
        
        var categoryColors = {
            '开发': '#512BD4',
            '浏览': '#0078D4',
            '沟通': '#107C10',
            '娱乐': '#FF8C00',
            '办公': '#00B7C3',
            '社交': '#E74856',
            '其他': '#8B5CF6'
        };
        
        var categoryList = ['开发', '浏览', '沟通', '娱乐', '办公', '社交', '其他'];
        
        function getCategoryColor(category) {
            return categoryColors[category] || categoryColors['其他'];
        }
        
        function showEmpty() {
            document.getElementById('chart').style.display = 'none';
            document.getElementById('empty').style.display = 'flex';
        }
        
        function hideEmpty() {
            document.getElementById('chart').style.display = 'block';
            document.getElementById('empty').style.display = 'none';
        }
        
        function renderSankey(data) {
            try {
                // 壳每分钟会把「近 7 天」载荷注入一次（自动刷新）。用户选过别的范围时
                // 必须忽略它，否则选择会在 60 秒后被刷回 7 天。
                // 页面自己取的数据带 __explicit 标记，不受此限。
                if (data && !data.__explicit &&
                    chosenDays !== null && !isNaN(chosenDays) && chosenDays !== 7) {
                    return 'skip: 保持用户选择的范围';
                }
                if (!data || !data.nodes || !data.links) {
                    showEmpty();
                    return 'error: invalid data';
                }
                
                if (data.nodes.length === 0) {
                    showEmpty();
                    return 'error: no nodes';
                }
                
                hideEmpty();
                
                if (chart) {
                    chart.dispose();
                }
                chart = echarts.init(document.getElementById('chart'));
                
                var maxValue = 0;
                for (var i = 0; i < data.nodes.length; i++) {
                    if (data.nodes[i].value > maxValue) {
                        maxValue = data.nodes[i].value;
                    }
                }
                
                var nodes = [];
                for (var i = 0; i < data.nodes.length; i++) {
                    var n = data.nodes[i];
                    var size = 25;
                    if (maxValue > 0) {
                        size = 15 + (n.value / maxValue) * 45;
                    }
                    var color = getCategoryColor(n.category);
                    nodes.push({
                        name: n.name,
                        symbolSize: size,
                        category: n.category || '其他',
                        itemStyle: {
                            color: color,
                            borderColor: '#fff',
                            borderWidth: 2,
                            shadowBlur: 10,
                            shadowColor: 'rgba(0, 0, 0, 0.2)'
                        },
                        label: {
                            show: true,
                            fontSize: 11,
                            fontWeight: 'bold',
                            color: cssVar('--text', '#e8e0d0')
                        }
                    });
                }
                
                var maxLinkValue = 0;
                for (var j = 0; j < data.links.length; j++) {
                    if (data.links[j].value > maxLinkValue) {
                        maxLinkValue = data.links[j].value;
                    }
                }
                
                var links = [];
                for (var j = 0; j < data.links.length; j++) {
                    var l = data.links[j];
                    var width = 1;
                    if (maxLinkValue > 0) {
                        width = 0.5 + (l.value / maxLinkValue) * 6;
                    }
                    
                    links.push({
                        source: l.source,
                        target: l.target,
                        value: l.value,
                        lineStyle: {
                            width: width,
                            opacity: 0.4,
                            curveness: 0.2,
                            color: 'source'
                        }
                    });
                }
                
                var categories = [];
                for (var k = 0; k < categoryList.length; k++) {
                    var cat = categoryList[k];
                    categories.push({
                        name: cat,
                        itemStyle: {
                            color: categoryColors[cat]
                        }
                    });
                }
                
                chart.setOption({
                    backgroundColor: 'transparent',
                    tooltip: {
                        trigger: 'item',
                        // 原来写死白底 + 主题字色：深色主题下是「白底白字」，看不见
                        backgroundColor: cssVar('--surface-2', '#1a1d22'),
                        borderColor: cssVar('--border', '#3c4043'),
                        borderWidth: 1,
                        textStyle: {
                            color: cssVar('--text', '#e8e0d0')
                        },
                        formatter: function(params) {
                            if (params.dataType === 'node') {
                                var mins = params.data.value || 0;
                                return '<div style="padding: 4px 8px;"><strong style="font-size: 14px;">' + params.name + '</strong><br/><span style="color:' + cssVar('--mute', '#8d8272') + ';">使用时长: ' + mins + ' 分钟</span></div>';
                            } else {
                                return '<div style="padding: 4px 8px;"><strong>' + params.data.source + ' → ' + params.data.target + '</strong><br/><span style="color:' + cssVar('--mute', '#8d8272') + ';">切换次数: ' + params.data.value + ' 次</span></div>';
                            }
                        }
                    },
                    legend: {
                        data: categoryList,
                        orient: 'vertical',
                        right: 20,
                        top: 16,
                        itemWidth: 12,
                        itemHeight: 12,
                        textStyle: {
                            fontSize: 12,
                            color: cssVar('--text', '#e8e0d0')
                        },
                        selectedMode: 'multiple'
                    },
                    series: [{
                        type: 'graph',
                        layout: 'force',
                        data: nodes,
                        links: links,
                        categories: categories,
                        roam: true,
                        draggable: true,
                        label: {
                            show: true,
                            position: 'right',
                            formatter: '{b}'
                        },
                        labelLayout: {
                            hideOverlap: true
                        },
                        force: {
                            repulsion: 400,
                            edgeLength: [80, 180],
                            gravity: 0.08,
                            layoutAnimation: false
                        },
                        emphasis: {
                            focus: 'adjacency',
                            itemStyle: {
                                shadowBlur: 20,
                                shadowColor: 'rgba(0, 0, 0, 0.3)'
                            },
                            lineStyle: {
                                width: 8,
                                opacity: 0.8
                            }
                        },
                        lineStyle: {
                            opacity: 0.4,
                            curveness: 0.2
                        }
                    }]
                });
                
                if (data.summary) setMeta(data.summary);
                return 'success: ' + nodes.length + ' nodes, ' + links.length + ' links';
            } catch (e) {
                return 'error: ' + e.message;
            }
        }
        
        function resize() {
            if (chart) chart.resize();
        }

        // ---------- 日期范围（4.12.46）----------
        // 默认仍是近 7 天（与壳注入的载荷一致），用户选过就记住，下次进来按上次的来。
        var DAYS_KEY = 'pch.sankeyDays';
        var chosenDays = null;
        try {
            var savedDays = localStorage.getItem(DAYS_KEY);
            if (savedDays !== null && savedDays !== '') chosenDays = Number(savedDays);
        } catch (e) { /* 存储被禁用时按默认走 */ }

        function setMeta(text) {
            var m = document.getElementById('meta');
            if (m) m.textContent = text || '';
        }

        function markRange(days) {
            var bar = document.getElementById('ranges');
            if (!bar) return;
            Array.prototype.forEach.call(bar.children, function (b) {
                b.className = (Number(b.getAttribute('data-days')) === days) ? 'on' : '';
            });
        }

        function pickRange(days) {
            if (!window.__TAURI__) { setMeta('壳未注入 IPC，无法切换范围'); return; }
            chosenDays = days;
            try { localStorage.setItem(DAYS_KEY, String(days)); } catch (e) { }
            markRange(days);
            setMeta('读取中…');
            window.__TAURI__.core.invoke('sankey_data', { days: days }).then(function (d) {
                if (d) d.__explicit = true;
                var r = renderSankey(d);
                window.__SANKEY_RESULT__ = 'range ' + days + ': ' + r;
                if (!(d && d.summary)) setMeta('');
            }).catch(function (e) {
                setMeta('读取失败：' + e);
                window.__SANKEY_RESULT__ = 'range error: ' + e;
            });
        }

        function bindRanges() {
            var bar = document.getElementById('ranges');
            if (!bar) return;
            Array.prototype.forEach.call(bar.children, function (b) {
                b.addEventListener('click', function () {
                    pickRange(Number(b.getAttribute('data-days')));
                });
            });
            // 壳注入的永远是近 7 天；用户上次选过别的范围就覆盖一次
            if (chosenDays !== null && !isNaN(chosenDays)) {
                markRange(chosenDays);
                if (chosenDays !== 7) pickRange(chosenDays);
            } else {
                markRange(7);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bindRanges);
        } else {
            bindRanges();
        }

        window.onresize = resize;
    </script>
</body>
</html>
