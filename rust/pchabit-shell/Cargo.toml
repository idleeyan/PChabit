[package]
name = "pchabit-shell"
version = "4.12.31"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry", "tray-icon", "image-ico"] }
tauri-plugin-notification = "2"
serde_json = "1"
# P4-1：壳直接复用数据面库，不再起子进程做 IPC
pchabit-datad = { path = "../pchabit-datad" }
# P5-1：`--host` 时壳自己当采集宿主（netd 托管 + 采样 + 钩子 + 落库）
pchabit-collect = { path = "../pchabit-collect" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
