[package]
name = "pchabit-datad"
version = "0.1.0"
edition = "2021"
description = "PChabit 数据面：只读 SQLite 的应用统计计算（P3 第一块，独立进程持有 rusqlite）"

[[bin]]
name = "pchabit-datad"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
rust_xlsxwriter = "0.102.0"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
